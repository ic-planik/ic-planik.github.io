/* =====================================================================
   LOG DE USO — só o Admin

   Duas perguntas de gestão que o relatório não respondia: quem realmente
   abre a plataforma, e o que estão perguntando ao assistente. A segunda é
   a mais valiosa: a lista de perguntas é o mapa do que a diretoria quer
   saber e o relatório ainda não mostra na tela.

   A porta de verdade é a regra do Firestore (leitura e exclusão só para
   admin@planik.app). O teste daqui esconde o botão; não é ele que protege.

   A consulta usa faixa de data sobre "ts" e ordena pelo mesmo campo —
   assim o Firestore resolve com o índice que já existe, sem pedir índice
   composto no console. Filtro de tipo e de pessoa é feito depois, na tela,
   sobre o que já veio.
   ===================================================================== */
function podeVerLog(){ return ((window.currentUser||{}).user==="admin"); }

let LOG=[], LOGST="", LOGCARREGANDO=false, LOGCONFIRMA="";
const LOGF={de:"",ate:"",tipo:"",quem:""};
const TETO_LOG=2000;

function dtHora(ts){
  const d=new Date(ts), p=x=>(x<10?"0":"")+x;
  return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()
    +" "+p(d.getHours())+":"+p(d.getMinutes());
}
function isoHoje(dias){
  const d=new Date(); if(dias) d.setDate(d.getDate()-dias);
  const p=x=>(x<10?"0":"")+x;
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
const MESNOME=["janeiro","fevereiro","março","abril","maio","junho","julho",
               "agosto","setembro","outubro","novembro","dezembro"];
function mesPorExtenso(m){            /* "2026-07" → "julho de 2026" */
  const p=String(m||"").split("-");
  return (MESNOME[(+p[1]||1)-1]||"?")+" de "+(p[0]||"?");
}

function carregarLog(){
  if(!window.PLK_DB){ LOGST="Sem conexão com o banco."; pintaLog(); return; }
  LOGCARREGANDO=true; LOGCONFIRMA=""; pintaLog();
  const ini=new Date(LOGF.de+"T00:00:00").getTime();
  const fim=new Date(LOGF.ate+"T23:59:59").getTime();
  window.PLK_DB.collection("log")
    .where("ts",">=",ini).where("ts","<=",fim)
    .orderBy("ts","desc").limit(TETO_LOG).get()
    .then(sn=>{
      LOG=[]; sn.forEach(d=>LOG.push(Object.assign({_id:d.id},d.data())));
      LOGST = LOG.length>=TETO_LOG
        ? `Mostrando os ${nf(TETO_LOG)} registros mais recentes do período — estreite as datas para ver o resto.`
        : `${nf(LOG.length)} registro(s) no período.`;
      LOGCARREGANDO=false; pintaLog();
    })
    .catch(e=>{
      LOG=[]; LOGCARREGANDO=false;
      LOGST = String((e&&e.code)||"").indexOf("permission")>=0
        ? "O banco recusou a leitura. Falta publicar a regra do Firestore para a coleção log."
        : "Não consegui ler o log agora. Tente de novo em instantes.";
      pintaLog();
    });
}

function apagarMes(mes){
  if(!window.PLK_DB) return;
  LOGST="Apagando "+mesPorExtenso(mes)+"…"; LOGCARREGANDO=true; pintaLog();
  let total=0;
  const rodada=()=>window.PLK_DB.collection("log").where("mes","==",mes).limit(300).get()
    .then(sn=>{
      if(sn.empty){
        LOGCARREGANDO=false; LOGCONFIRMA="";
        LOGST=total?`${nf(total)} registro(s) de ${mesPorExtenso(mes)} apagados.`
                   :`Não havia registro de ${mesPorExtenso(mes)}.`;
        carregarLog(); return;
      }
      const lote=window.PLK_DB.batch();
      sn.forEach(d=>lote.delete(d.ref));
      total+=sn.size;
      return lote.commit().then(rodada);          /* de 300 em 300 até zerar */
    })
    .catch(()=>{
      LOGCARREGANDO=false;
      LOGST="O banco recusou a exclusão. Confira a regra do Firestore para a coleção log.";
      pintaLog();
    });
  rodada();
}

/* Prévia de uma linha: o markdown do assistente vira texto corrido. Sem isso a
   tabela mostra "**O Core Klabin é o gargalo.**" com os asteriscos à mostra. */
function resumoResp(t){
  return String(t||"").replace(/\*\*/g,"").replace(/^[\s>#-]+/gm,"")
    .replace(/\s+/g," ").trim().slice(0,150);
}
function logFiltrado(){
  return LOG.filter(r=>
    (!LOGF.tipo || r.tipo===LOGF.tipo) &&
    (!LOGF.quem || r.user===LOGF.quem));
}

function pintaLog(){
  const el=document.getElementById("logBody"); if(!el) return;

        medio!=null?`${nf(medio,1)} s de resposta em média`:"—")}
      ${cartao("Perguntas com erro",nf(falhas),

    </div>

    ${linhas.length?`<div class="scroll"><table class="tb"><thead><tr>

        <td class="nm">${esc(r.nome||r.user||"?")}
          <span style="display:block;font-size:10.5px;color:var(--muted);font-weight:400">${esc(r.user||"")}</span></td>
        <td>${r.tipo==="acesso"?"Entrou na plataforma"

              ${esc(resumoResp(r.resposta))}${
                String(r.resposta||"").length>150?"… <b>ver completa</b>":""}</span>`}</td>
      </tr>`).join("")}
      </tbody></table></div>`
    :`<div class="cfgnote" style="padding:18px 2px">${LOGCARREGANDO?"Carregando…":"Nenhum registro com esses filtros."}</div>`}

    <div class="grouphd" style="margin-top:18px">Limpeza</div>
    <div class="sub" style="margin:-4px 0 9px">Apaga o mês inteiro, de todas as pessoas.
      Não tem como desfazer — exporte antes se for precisar depois.</div>
    <div class="cfgrow" style="border-bottom:0">
      <select class="selin" id="logMes" ${meses.length?"":"disabled"}>
        ${meses.length?meses.map(m=>`<option value="${m}" ${LOGCONFIRMA===m?"selected":""}>${mesPorExtenso(m)}</option>`).join("")
                     :'<option>nenhum mês carregado</option>'}
      </select>
      <button class="txtbtn" id="logDel" ${meses.length&&!LOGCARREGANDO?"":"disabled"}

/* =====================================================================
   CONFERÊNCIA BI × EXCEL
   Dois caminhos independentes até o mesmo número: de um lado o site soma
   a Base linha a linha; do outro, o que a planilha publica nos blocos-
   resumo dela (Por Canal RESUMIDO, caixa de KPI de Metas 2026, VSOs 2026).
   Se baterem, a Base e os resumos estão sincronizados. Se não baterem,
   alguém mexeu num lado e não no outro — e é melhor descobrir aqui do que
   numa reunião de diretoria.

   A comparação roda SEMPRE no Geral, mesmo com o botão Ato pago ligado:
   a planilha não tem recorte de ato, então comparar contra ela em Ato pago
   acusaria divergência em tudo, sem que nada esteja errado.
   ===================================================================== */
const TOL={moeda:1, qtd:0.01, taxa:0.0002};   // centavo, meia venda arredondada, 0,02 p.p.
function abrirConferencia(){
  if(!podeVerCfg()) return;
  const C=D.conferencia||{};

  const ating=metaYTD?vgv/metaYTD:null;

  const itens=[
    {rot:"VGV realizado",            bi:vgv,      ex:C.vgvYTD,  fmt:moeda, tol:TOL.moeda,
     fonte:"Base, linha a linha × Por Canal RESUMIDO · VGV REAL YTD"},
    {rot:"Quantidade de vendas",     bi:qtd,      ex:C.qtdYTD,  fmt:nfu,   tol:TOL.qtd,
     fonte:"soma da coluna Peso × Por Canal RESUMIDO · QTD YTD",
     nota:"vaga de garagem pesa 0 e venda Fifith pesa 0,5 para cada equipe"},
    {rot:"Atingimento da meta",      bi:ating,    ex:C.ating,   fmt:v=>pct1(v), tol:TOL.taxa,
     fonte:"VGV da Base ÷ meta YTD × Por Canal RESUMIDO · ATINGIMENTO"},
    {rot:`VSO ano YTD`,              bi:vso,      ex:C.vsoAnoYTD, fmt:v=>v==null?"—":nf(v*100,2)+"%", tol:TOL.taxa,
     fonte:"VGV da Base ÷ estoque inicial × VSOs 2026 · bloco VSO ANO YTD"},
    {rot:"Meta do ano",              bi:metaAno,  ex:C.metaAno, fmt:moeda, tol:TOL.moeda,
     fonte:"soma dos 12 meses de Metas 2026 × caixa de KPI Meta ANO"},
    {rot:`Meta YTD (até ${MESL[mesRef-1]||"—"})`, bi:metaYTD, ex:C.metaYTD, fmt:moeda, tol:TOL.moeda,
     fonte:"soma dos meses até o mês de referência × Por Canal RESUMIDO · VGV META YTD"},
  ];
  const bate=i=>i.bi!=null&&i.ex!=null&&Math.abs(i.bi-i.ex)<=i.tol;
  const semDado=i=>i.bi==null||i.ex==null;
  const divergentes=itens.filter(i=>!semDado(i)&&!bate(i));
  const faltando=itens.filter(semDado);

  const selo=i=>semDado(i)
    ? `<span class="selo aviso" title="Sem número dos dois lados para comparar">?</span>`

          : faltando.length
          ? `${faltando.map(i=>i.rot).join(", ")} sem número comparável nesta extração.`
          : `Os ${itens.length} indicadores batem entre a Base e os blocos-resumo da planilha.`}</div></div>

        <th class="r">Diferença</th><th class="c">Confere</th></tr></thead>
      <tbody>${itens.map(i=>{
        const dif=semDado(i)?null:i.bi-i.ex;
        return `<tr><td class="nm stickyc">${i.rot}
          <span style="display:block;font-size:10.5px;color:var(--muted);font-weight:400;white-space:normal">
            ${i.fonte}${i.nota?` · ${i.nota}`:""}</span></td>

          <td class="r" style="color:${dif&&Math.abs(dif)>i.tol?"var(--bad)":"var(--muted)"}">
            ${dif==null?"—":Math.abs(dif)<=i.tol?"—":(dif>0?"+":"")+i.fmt(dif)}</td>
          <td class="c">${selo(i)}</td></tr>`;}).join("")}
      </tbody></table></div>
      <div class="sub" style="margin-top:12px">Fonte do lado Excel: ${esc(C.fonte||"—")}.

            <span style="margin-left:auto">${nf(TX.length)} linhas na Base · <b>${nfu(qtd)}</b> unidades</span>`},
    true);
}

    </div>`:"")

    const sel=row.querySelector("[data-time]");

    salvarTime(); pintaCfg(); reRender();

  const cnf=document.getElementById("cfgConf");

  const lg=document.getElementById("cfgLog");

      const i=document.createElement("input"); i.type="file"; i.accept="application/json";
      i.onchange=()=>{ const f=i.files[0]; if(!f) return; const r=new FileReader();
        r.onload=()=>{ try{ TIME=mesclarTime(JSON.parse(r.result)); salvarTime(); pintaCfg(); reRender(); }
          catch(e){ alert("Arquivo inválido."); } }; r.readAsText(f); };
      i.click(); }); }
  const rst=document.getElementById("cfgRst");
  if(rst&&!rst.dataset.lig){ rst.dataset.lig=1;
    rst.addEventListener("click",()=>{ if(!cfgEdicao) return;
      if(confirm("Restaurar o cadastro exatamente como está na planilha? Suas alterações manuais serão perdidas.")){
        TIME=sementeTime(); salvarTime(); pintaCfg(); reRender(); } }); }

   ===================================================================== */
/* ---------------------------------------------------------------------
   Recorte de ato nos números de VIDA do empreendimento.

   A planilha traz vendido-vida e estoque como posição, sem coluna de ato —
   e ato só existe em 2026. A regra: tudo que é anterior a 2026 conta como
   ato pago, então a única coisa que muda no recorte são as vendas do ano
   que ainda estão pendentes. Elas saem do vendido e voltam para o estoque.

   VGV total e unidades totais não se movem, e nem deveriam: o empreendimento
   tem o tamanho que tem, independente de quem pagou o ato.
   --------------------------------------------------------------------- */
function ajusteAto(produto){
  if(ATO!=="pago") return {vgv:0,uni:0};
  const pend=TXPEND.filter(t=>!produto||t.produto===produto);
  return {vgv:soma(pend),uni:unid(pend)};
}

  </div>

/* Recortes de canal da aba Vendas. No acesso restrito existe um canal só, e
   um seletor de um botão é ruído: ele some, e o rótulo diz qual recorte é. */
const VISTAS=visaoRestrita()
  ? [{id:"Geral",rot:"Parcerias",canal:null}]
  : [{id:"Geral",rot:"Geral",canal:null},
     {id:"House",rot:"House (Salão + Online)",canal:HOUSE}]
      .concat(CANAIS.map(c=>({id:c,rot:c,canal:c})));
let vVenda="Geral";

/* Meta por produto e mês, para um canal (ou o total, quando canal = null).
   Sai direto da aba "Metas 2026", que tem um bloco por canal — então um canal
   novo passa a ter meta sozinho, sem mexer no site. */
function metaProdCanal(canal){
  const out={};
  if(!canal){ ((D.metas&&D.metas.geral&&D.metas.geral.produtos)||[])
      .forEach(p=>out[p.produto]=(p.meta||[]).slice()); return out; }
  (Array.isArray(canal)?canal:[canal]).forEach(c=>{
    const b=(D.metas&&D.metas.canais||{})[c]; if(!b) return;
    (b.produtos||[]).forEach(p=>{
      out[p.produto]=out[p.produto]||Array(12).fill(0);
      (p.meta||[]).forEach((v,i)=>out[p.produto][i]+=v||0);
    });
  });
  return out;
}
/* Realizado por produto e mês vem SEMPRE das transações da Base — nunca de uma
   aba intermediária. É o que garante que um canal novo (Lançadora) apareça. */
function realProdCanal(canal,per){
  const real={},qtd={};
  filtrar(canal?{canal}:{},per).forEach(t=>{
    if(!real[t.produto]){ real[t.produto]=Array(12).fill(0); qtd[t.produto]=Array(12).fill(0); }
    /* soma o PESO, não a linha: uma venda Fifith são duas linhas de meia
       unidade, e uma linha somada da visão restrita vale por várias vendas.
       Contar linha faria o balãozinho discordar do resto do relatório. */
    if(t.mes!=null){ real[t.produto][t.mes]+=t.valor; qtd[t.produto][t.mes]+=(t.peso||0); }
  });
  return {real,qtd};
}
function serieVista(id,per){
  const canal=(VISTAS.find(v=>v.id===id)||{}).canal;
  const metas=metaProdCanal(canal), {real,qtd}=realProdCanal(canal,per);
  return PRODUTOS.map(p=>({produto:p, meta:metas[p]||Array(12).fill(0),
    real:real[p]||Array(12).fill(0), qtd:qtd[p]||Array(12).fill(0)}));
}

/* =====================================================================
   4 · DESCONTO POR PRODUTO
   O desconto máximo é política da companhia e vem da planilha.

   A MÉDIA não é média de percentuais: é o desconto total concedido em reais
   dividido pelo valor de tabela total. Para cada venda, o valor de tabela
   sai de valor ÷ (1 + desconto) — o desconto na Base é negativo, então
   dividir "desfaz" o abatimento e devolve o preço cheio.

       média = (Σ valor − Σ tabela) ÷ Σ tabela

   É assim que a planilha passou a calcular, e faz diferença de verdade:
   no Core Klabin a média simples dá −11,73% e esta dá −10,82%, porque a
   média simples deixa uma unidade pequena com desconto grande pesar igual
   a uma unidade grande com desconto pequeno. Conferido célula a célula
   contra a aba DESCONTO POR PRODUTO: 11 produtos e as 53 células mensais
   fecham com a planilha.

   A perda nominal também vem do valor de tabela, não do VGV vendido —
   mesma base da média, senão os dois números contariam histórias diferentes.
   ===================================================================== */
const perDesc=novoPeriodo();
const POLITICA=(function(){ const o={};
  (D.desconto||[]).forEach(d=>{ if(d.maximo!=null) o[d.produto]=d.maximo; }); return o; })();

/* valor de tabela: o preço antes do abatimento */
const tabela=t=>t.valor/(1+t.desconto);
/* desconto agregado de um conjunto de vendas; null se ninguém tem desconto */
function descAgregado(rows){
  let val=0,tab=0;
  rows.forEach(t=>{ if(t.desconto==null) return; val+=t.valor; tab+=tabela(t); });
  return tab>0?{taxa:(val-tab)/tab,tabela:tab,vgv:val}:null;
}

function calcDesconto(per){
  return PRODUTOS.map(p=>{
    const vendas=filtrar({produto:p},per);
    const comDesc=vendas.filter(t=>t.desconto!=null);
    const ag=descAgregado(comDesc);
    const media=ag?ag.taxa:null;
    const mensal=Array.from({length:12},(_,i)=>{
      const a=descAgregado(comDesc.filter(t=>t.mes===i));
      return a?a.taxa:null;
    });
    const max=POLITICA[p]!=null?POLITICA[p]:null;
    const perda=(media!=null&&max!=null)?Math.min(0,media-max):null;
    return {produto:p,mensal,media,max,perda,vgv:soma(vendas),vendas:unid(vendas),
            tabela:ag?ag.tabela:0,
            nominal:perda!=null?Math.abs(perda)*(ag?ag.tabela:0):null};
  });
}
function rDesconto(){
  $("#p-desconto").innerHTML=`
    <div class="card" style="margin-bottom:13px"><div class="periodo" id="pdSel"></div>
      <div class="sub" style="margin-top:8px">O <b>desconto máximo</b> é o teto aprovado pela companhia e vem da planilha.
        A <b>média</b> e a <b>perda</b> são recalculadas com as vendas do período selecionado:
        desconto concedido em reais sobre o <b>valor de tabela</b>, e não média de percentuais —
        assim uma unidade grande pesa mais que uma pequena, como passou a ser na planilha.</div></div>
    <div id="pdCorpo"></div>`;
  seletorPeriodo("pdSel",perDesc,pintaDesconto);
  pintaDesconto();
}
function pintaDesconto(){

  const totalNominal=L.reduce((s,x)=>s+(x.nominal||0),0);

        <b>${pct1(totalVGV?totalNominal/totalVGV:0)}</b> do VGV vendido no período</div></div>
    <div class="card kpi"><div class="lab">Desconto médio concedido</div>
      <div class="val">${mediaGeral!=null?nf(mediaGeral*100,2)+"%":"—"}</div>
      <div class="sub">Desconto em reais sobre <b>${moeda(agGeral?agGeral.tabela:0)}</b> de valor de tabela<br>
        ${nf(comPerda.length)} empreendimento(s) acima do teto</div></div>
    <div class="card kpi"><div class="lab">Maior perda</div>
      ${pior?`<div class="val sm">${esc(pior.produto)}</div>
        <div class="sub"><b>${moeda(pior.nominal)}</b> · desconto médio de
          <b>${nf(pior.media*100,2)}%</b> contra teto de <b>${nf(pior.max*100,2)}%</b></div>`
        :`<div class="val sm">—</div><div class="sub">Nenhum empreendimento passou do teto no período</div>`}</div>
  </div>
  <div class="card" data-cart="desconto">
    <div class="hd"><div class="h">Desconto por empreendimento</div>
      <div class="sub">Média mensal do desconto concedido · <span style="color:var(--good)">verde</span>
        dentro do teto, <span style="color:var(--bad)">vermelho</span> acima ·
        clique no empreendimento para ver as vendas</div></div>

/* Meta acumulada até o mês de referência da planilha, para um canal ou grupo. */
function metaYTDCanal(canal){
  const M=(D.metas&&D.metas.canais)||{};
  return (Array.isArray(canal)?canal:[canal]).reduce((s,c)=>
    s+(M[c]&&M[c].metaAcum?(M[c].metaAcum[MESREF-1]||0):0),0);
}
function aggCanais(){
  const M=D.metas.canais||{}, out=[];
  CANAIS.forEach(c=>{
    const tx=filtrar({canal:c});
    out.push({canal:c, real:soma(tx), qtd:unid(tx),
      meta:M[c]?(M[c].metaAcum[11]||0):0, serie:M[c]?M[c].real:null});
  });
  const tot=out.reduce((s,c)=>s+c.real,0), interna=(D.realYTD||0)-tot;
  if(interna>1){ const tx=filtrar({canal:"Interna"});
    out.push({canal:"Interna",real:interna,qtd:unid(tx),meta:0,serie:null}); }
  return out;
}

function abrirCanal(c){

function metaCanal(canal){

  return lista.reduce((s,c)=>s+(M[c]?(M[c].metaAcum[11]||0):0),0);
}

  vGerModo==="matriz"?pintaMatrizGer():pintaRankingGer();

function gerentesDoRecorte(){
  const canal=(VG.find(v=>v.id===vGer)||{}).canal;
  const rows=filtrar({canal},perGer);
  const por={};
  let foraDoTime=0;
  rows.forEach(t=>{
    const g=t.gerente||"—"; if(kk(g)==="INTERNA") return;
    if(!ativo(g)){ foraDoTime+=t.valor; return; }          // só gerentes ativos no cadastro
    (por[g]=por[g]||{vgv:0,qtd:0,mes:Array(12).fill(0),ult:null});
    por[g].vgv+=t.valor; por[g].qtd+=(t.peso||0); if(t.mes!=null) por[g].mes[t.mes]+=t.valor;
    if(t.data&&(!por[g].ult||t.data>por[g].ult)) por[g].ult=t.data; });
  // gerentes ativos que ainda não venderam também entram, zerados
  Object.keys(TIME).forEach(n=>{ if(!TIME[n].ativo||por[n]) return;
    const t=TIME[n].time;
    const cabe = vGer==="geral" ? (t==="House"||t==="Parcerias")
               : vGer==="house" ? t==="House" : t==="Parcerias";
    if(cabe) por[n]={vgv:0,qtd:0,mes:Array(12).fill(0),ult:null};
  });
  return {canal,foraDoTime,
    lista:Object.entries(por).map(([g,v])=>({nome:g,...v})).sort((a,b)=>b.vgv-a.vgv)};
}
/* Última venda do gerente. O "há N dias" é medido contra o FIM do período em
   tela, não contra hoje: olhando o 1º trimestre, "há 200 dias" não diria nada.
   Passa de 30 dias sem vender e o número fica em vermelho — é o sinal que a
   diretoria procura quando pergunta quem não está entregando. */
function ultVenda(iso){
  if(!iso) return '<span style="color:var(--muted)">sem venda</span>';
  const ref=(perGer.fim>hojeISO()?hojeISO():perGer.fim);
  const d=diasEntre(iso,ref);
  const cor=d==null?"var(--muted)":d>60?"var(--bad)":d>30?"var(--warn)":"var(--ink-2)";
  return `${dtBR(iso)}<span style="display:block;font-size:10px;color:${cor}">${
    d==null?"":d<=0?"hoje":d===1?"há 1 dia":`há ${nf(d)} dias`}</span>`;
}
function metaGerente(nome){
  const G=D.gerentes||{}, ms=mesesDoPeriodo(perGer);
  for(const bloco of ["parcerias","plkGeral","lancadoras"]){
    const x=(G[bloco]||[]).find(g=>kk(g.nome)===kk(nome));
    if(x) return ms.reduce((s,i)=>s+((x.meta||[])[i]||0),0);
  }
  return null;
}

      <tr class="tot"><td></td><td class="stickyc">Total</td><td class="r">${moeda(total)}</td>
        <td class="r">${nfu(lista.reduce((s,g)=>s+g.qtd,0))}</td>

    </tbody></table></div>
    ${foraDoTime>1?`<div class="sub" style="margin-top:11px;padding-top:11px;border-top:1px solid var(--grid)">

    </div>`;
  document.querySelectorAll("#gCorpo tr[data-g]").forEach(tr=>{

      modalVendas(g,`${(VG.find(v=>v.id===vGer)||{}).rot} · vendas do período`,filtrar({canal,gerente:g},perGer)));

function pintaMatrizGer(){
  const {canal,lista}=gerentesDoRecorte();
  const ativos=new Set(lista.map(g=>kk(g.nome)));

     ativos, sem Interna). Se eu usasse o total geral do empreendimento as
     colunas não fechariam 100% e a primeira pergunta seria "cadê o resto". */
  filtrar({canal},perGer).forEach(t=>{ if(kk(t.gerente)==="INTERNA"||!ativos.has(kk(t.gerente))) return;

    <div class="scroll"><table class="tb num"><thead><tr><th class="stickyc">Gerente</th>
      ${prods.map(p=>`<th class="c" style="font-size:9.5px;white-space:normal;max-width:82px">${esc(p)}
        <span style="display:block;font-weight:400;opacity:.7">${nfu(totProd[p]||0)} unidade${(totProd[p]||0)===1?"":"s"}</span></th>`).join("")}
      <th class="r">Total</th><th class="r">VGV</th></tr></thead>
    <tbody>${lista.map(g=>{
      const tq=prods.reduce((s,p)=>s+(qtd[g.nome+"||"+p]||0),0);
      return `<tr><td class="nm stickyc">${rotGer(g.nome)}</td>
      ${prods.map(p=>{ const k=g.nome+"||"+p, v=cel[k]||0, n=qtd[k]||0;
        const sh=totProd[p]?n/totProd[p]:0;
        const int=v?Math.round((0.12+0.88*(v/max))*72):0;
        return `<td class="c" ${v?`style="cursor:pointer;padding:6px 8px;background:color-mix(in srgb,var(--s1) ${int}%,transparent)"
          data-g="${esc(g.nome)}" data-p="${esc(p)}"
          data-tip="<b>${esc(g.nome)}</b> → ${esc(p)}<br><b>${nfu(n)}</b> unidade(s) · <b>${pct1(sh)}</b> das unidades do empreendimento<br>VGV: <b>${moeda(v)}</b><br><span style='color:var(--muted)'>clique para abrir</span>">
          <b style="font-size:13px">${nfu(n)}</b>
          <span style="display:block;font-size:10px;color:var(--ink-2)">${pct1(sh)}</span>`
          :'style="color:var(--muted)">·'}</td>`; }).join("")}
      <td class="r"><b>${nfu(tq)}</b><span style="display:block;font-size:10px;color:var(--ink-2);font-weight:400">${pct1(tq/totQtd)}</span></td>
      <td class="r"><b>${moeda(g.vgv)}</b></td></tr>`; }).join("")}
      <tr class="tot"><td class="stickyc">Total</td>
        ${prods.map(p=>`<td class="c">${nfu(totProd[p]||0)}<span style="display:block;font-size:10px;font-weight:400">100%</span></td>`).join("")}
        <td class="r">${nfu(totQtd)}<span style="display:block;font-size:10px;font-weight:400">100%</span></td>
        <td class="r">${moeda(totVgv)}</td></tr>
    </tbody></table></div>
    <div class="sub" style="margin-top:11px">O número grande em cada célula é a <b>quantidade de unidades</b>
      e o percentual abaixo dele é a fatia daquele <b>empreendimento</b> que o gerente entregou — cada coluna
      fecha 100%. O tom de fundo representa o <b>VGV</b>, então dá para ver quem vende muitas unidades
      pequenas e quem vende poucas unidades grandes.</div></div>`;
  bindTips(document.getElementById("gCorpo"));
  document.querySelectorAll("#gCorpo td[data-g]").forEach(td=>td.addEventListener("click",()=>
    modalVendas(`${td.dataset.g} · ${td.dataset.p}`,"Gerente × empreendimento",
      filtrar({canal,gerente:td.dataset.g,produto:td.dataset.p},perGer))));
}

/* =====================================================================
   6 · PARCEIROS

   Parcerias não vende sozinha: quem leva o cliente até a mesa é uma
   imobiliária externa. A coluna "Parceiro" da Base é o nome dessa
   imobiliária, e ela só existe nas vendas do canal Parcerias — nos outros
   canais o campo vem vazio, porque lá a venda é nossa.

   Esta aba responde quatro perguntas que a diretoria faz sempre:

     · quem vende mais — o ranking, com todos os parceiros da planilha;
     · o que cada um vende — parceiro × empreendimento, no mesmo desenho
       do "Quem vendeu o quê" dos gerentes;
     · com quem cada um trabalha — parceiro × gerente;
     · quem é o principal parceiro de cada gerente, e o quanto o gerente
       depende dele.

   Uma observação de leitura que muda decisão: concentração não é elogio.
   Um gerente com 90% do VGV num parceiro só tem um resultado ótimo e um
   risco de carteira inteira; a aba mostra os dois lados no mesmo cartão.

   As vendas sem parceiro preenchido aparecem como "Sem parceiro". Elas
   contam no total — o dinheiro entrou — mas ficam fora do ranking e do
   pódio, porque "Sem parceiro" não é uma imobiliária com quem negociar.
   ===================================================================== */
const perParc=novoPeriodo();
const VP=[{id:"ranking",rot:"Ranking de parceiros"},
          {id:"prod",   rot:"Parceiro × Empreendimento"},
          {id:"ger",    rot:"Parceiro × Gerente"},
          {id:"mes",    rot:"Parceiro × Mês"},
          {id:"dono",   rot:"Principal parceiro de cada gerente"}];
let vParc="ranking", fParcGer="", fParcProd="", parcTodos=false;

const SEM_PARC="Sem parceiro";
/* "-", "—", vazio: tudo isso é ausência de parceiro, não um parceiro chamado
   traço. Normalizar aqui evita três linhas diferentes para a mesma coisa. */
const nomeParc=t=>{ const p=String(t.parceiro==null?"":t.parceiro).trim();
  return (!p||/^[-–—·.]+$/.test(p))?SEM_PARC:p; };
const semParc=n=>n===SEM_PARC;

/* O recorte da aba: canal Parcerias, período escolhido e, se o usuário
   pediu, um gerente e/ou um empreendimento. Todo número da tela sai daqui —
   se o filtro está ligado, ele vale para o ranking, para as matrizes e para
   os cartões, sem exceção. */
function linhasParc(){
  const f={canal:"Parcerias"};
  if(fParcGer) f.gerente=fParcGer;
  if(fParcProd) f.produto=fParcProd;
  return filtrar(f,perParc);
}
function agregaParc(rows){
  const acc={};
  rows.forEach(t=>{
    const n=nomeParc(t);
    const a=acc[n]||(acc[n]={nome:n,vgv:0,qtd:0,mes:Array(12).fill(0),ult:null,pri:null,
                             gers:{},prods:{},linhas:0});
    a.vgv+=t.valor; a.qtd+=(t.peso||0); a.linhas++;
    if(t.mes!=null) a.mes[t.mes]+=t.valor;
    if(t.data){ if(!a.ult||t.data>a.ult) a.ult=t.data;
                if(!a.pri||t.data<a.pri) a.pri=t.data; }
    const g=t.gerente||"—";
    a.gers[g]=(a.gers[g]||0)+t.valor;
    a.prods[t.produto]=(a.prods[t.produto]||0)+t.valor;
  });
  return Object.values(acc).sort((a,b)=>b.vgv-a.vgv);
}
/* maior chave de um objeto {nome: valor} */
const maiorDe=o=>{ const e=Object.entries(o||{}).sort((a,b)=>b[1]-a[1]); return e.length?e[0]:null; };
/* Quantos parceiros somam 80% do VGV — a régua de concentração de carteira.
   O denominador é o VGV do CANAL, incluindo o que está sem parceiro
   preenchido: é o mesmo total da coluna "Share" da tabela e o mesmo que a
   base do assistente usa, então a resposta na tela e a resposta do chat não
   podem divergir. */
function concentracao(lista,alvo,total){
  const tot=total!=null?total:lista.reduce((s,p)=>s+p.vgv,0);
  if(!tot) return {n:0,tot:0};
  let ac=0,n=0;
  for(const p of lista){ ac+=p.vgv; n++; if(ac/tot>=(alvo||0.8)) break; }
  return {n,tot};
}
/* Só os parceiros de verdade concorrem no ranking. "Sem parceiro" fica de
   fora daqui e volta no rodapé da tabela e nos totais. */
const soParceiros=l=>l.filter(p=>!semParc(p.nome));

function rParceiros(){
  sincHoje(perParc);
  const rows=linhasParc();
  const lista=agregaParc(rows);
  const reais=soParceiros(lista);
  const semp=lista.find(p=>semParc(p.nome));
  const totVgv=lista.reduce((s,p)=>s+p.vgv,0);
  const totQtd=lista.reduce((s,p)=>s+p.qtd,0);
  const conc=concentracao(reais,0.8,totVgv);
  const top5=reais.slice(0,5).reduce((s,p)=>s+p.vgv,0);
  const gers=Array.from(new Set(filtrar({canal:"Parcerias"},perParc).map(t=>t.gerente||"—"))).sort();
  const prods=PRODUTOS.filter(p=>TX.some(t=>t.canal==="Parcerias"&&t.produto===p));

  $("#p-parceiros").innerHTML=`
  <div class="card" style="margin-bottom:13px"><div class="periodo" id="pparcSel"></div>
    <div class="sub" style="margin-top:8px">A coluna <b>Parceiro</b> da Base só é preenchida no canal
      <b>Parcerias</b> — esta aba é a leitura desse canal por imobiliária externa.</div></div>

  <div class="grid g4" style="margin-bottom:13px">
    <div class="card kpi"><div class="lab">VGV por parceiros</div>
      <div class="val">${moeda(totVgv)}</div>
      <div class="sub">${nfu(totQtd)} unidade${totQtd===1?"":"s"} ·
        ticket médio <b>${totQtd?moeda(totVgv/totQtd):"—"}</b></div></div>
    <div class="card kpi"><div class="lab">Parceiros que venderam</div>
      <div class="val">${nf(reais.length)}</div>
      <div class="sub">${semp?`mais <b>${moeda(semp.vgv)}</b> em ${nfu(semp.qtd)} unidade(s) sem parceiro preenchido`
        :"todas as vendas do período têm parceiro preenchido"}</div></div>
    <div class="card kpi"><div class="lab">Concentração</div>
      <div class="val">${nf(conc.n)}</div>
      <div class="sub">parceiro${conc.n===1?"":"s"} respondem por <b>80%</b> do VGV ·
        os 5 maiores fazem <b>${pct1(totVgv?top5/totVgv:null)}</b></div></div>
    <div class="card kpi"><div class="lab">Maior parceiro</div>
      <div class="val" style="font-size:17px;line-height:1.25">${esc(reais.length?reais[0].nome:"—")}</div>
      <div class="sub">${reais.length?`<b>${moeda(reais[0].vgv)}</b> · ${nfu(reais[0].qtd)} un ·
        <b>${pct1(totVgv?reais[0].vgv/totVgv:null)}</b> do canal`:"sem venda no período"}</div></div>
  </div>

  <div class="card" style="margin-bottom:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="tgl" id="pV">${VP.map(v=>`<button class="${v.id===vParc?"on":""}" data-v="${v.id}">${v.rot}</button>`).join("")}</div>
    <span class="lbl" style="margin-left:auto">Gerente</span>
    <select id="pFg"><option value="">Todos</option>
      ${gers.map(g=>`<option value="${esc(g)}" ${g===fParcGer?"selected":""}>${esc(g)}</option>`).join("")}</select>
    <span class="lbl">Empreendimento</span>
    <select id="pFp"><option value="">Todos</option>
      ${prods.map(p=>`<option value="${esc(p)}" ${p===fParcProd?"selected":""}>${esc(p)}</option>`).join("")}</select>
    ${(fParcGer||fParcProd)?`<button class="preset" id="pFlimpa">Limpar filtros</button>`:""}
  </div>
  <div id="pCorpo"></div>`;

  seletorPeriodo("pparcSel",perParc,rParceiros);
  document.getElementById("pV").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return; vParc=b.dataset.v; rParceiros(); });
  document.getElementById("pFg").addEventListener("change",e=>{ fParcGer=e.target.value; rParceiros(); });
  document.getElementById("pFp").addEventListener("change",e=>{ fParcProd=e.target.value; rParceiros(); });
  const lp=document.getElementById("pFlimpa");
  if(lp) lp.addEventListener("click",()=>{ fParcGer=""; fParcProd=""; rParceiros(); });

  const ctx={rows,lista,reais,semp,totVgv,totQtd,conc};
  ({ranking:pintaRankingParc, prod:pintaMatrizParcProd, ger:pintaMatrizParcGer,
    mes:pintaMatrizParcMes, dono:pintaDonoParc})[vParc](ctx);
  bindTips(document.getElementById("pCorpo"));
}

/* rótulo do recorte, para os títulos de modal não mentirem quando há filtro */
function rotParc(){
  const p=[];
  if(fParcGer) p.push(fParcGer);
  if(fParcProd) p.push(fParcProd);
  return p.length?" · "+p.join(" · "):"";
}
function filtroParc(extra){
  return Object.assign({canal:"Parcerias"},
    fParcGer?{gerente:fParcGer}:{}, fParcProd?{produto:fParcProd}:{}, extra||{});
}
/* abre as vendas de um parceiro respeitando os filtros da aba */
function vendasDoParceiro(nome,extra){
  const f=filtroParc(extra);
  return filtrar(f,perParc).filter(t=>nomeParc(t)===nome);
}

/* ---- 6.1 · ranking ---------------------------------------------------- */
function pintaRankingParc(c){
  const {reais,semp,totVgv,totQtd,conc}=c;
  const ref=(perParc.fim>hojeISO()?hojeISO():perParc.fim);
  /* Leitura rápida: o que um especialista olharia primeiro na tabela.
     "Parado" só interessa entre os parceiros que fazem o resultado. Numa
     carteira de 64 nomes, dezenas venderam uma unidade em janeiro e nunca
     mais — listar todos vira ruído. O aviso útil é quando alguém do núcleo
     que sustenta 80% do VGV parou de girar. */
  const nucleo=reais.slice(0,conc.n);
  const parados=nucleo.filter(p=>{ const d=diasEntre(p.ult,ref); return d!=null&&d>60; });
  const dep=totVgv&&reais.length?reais[0].vgv/totVgv:null;
  const podio=reais.slice(0,3);

  const linha=(p,i)=>{
    const g=maiorDe(p.gers), sh=totVgv?p.vgv/totVgv:0;
    return `<tr data-parc="${esc(p.nome)}" class="${semParc(p.nome)?"":"clickable"}">
      <td class="c" style="color:var(--muted)">${i==null?"—":i+1}</td>
      <td class="nm stickyc">${semParc(p.nome)
        ? `<span style="color:var(--muted)">${SEM_PARC}</span>`
        : `<span class="lnk" data-abrir="1">${esc(p.nome)}</span>`}</td>
      <td class="r"><b>${moeda(p.vgv)}</b></td>
      <td class="r">${nfu(p.qtd)}</td>
      <td class="r">${p.qtd?moeda(p.vgv/p.qtd):"—"}</td>
      <td class="r">${pct1(sh)}</td>
      <td class="r">${nf(Object.keys(p.prods).length)}</td>
      <td class="r">${nf(Object.keys(p.gers).length)}</td>
      <td class="nm">${g?`${esc(g[0])}<span style="display:block;font-size:10px;color:var(--ink-2)">${pct1(p.vgv?g[1]/p.vgv:null)} do parceiro</span>`:"—"}</td>
      <td class="r">${ultVendaRef(p.ult,ref)}</td>
      <td><span class="spark" data-exp="1" title="Ampliar mês a mês">${spark(p.mes,"var(--s3)")}</span></td></tr>`;
  };

  document.getElementById("pCorpo").innerHTML=`
  ${podio.length?`<div class="grid g3" style="margin-bottom:13px">
    ${podio.map((p,i)=>`<div class="card" style="border-top:3px solid ${["var(--s1)","var(--s2)","var(--s3)"][i]}">
      <div class="lab">${i+1}º lugar</div>
      <div style="font-weight:700;font-size:15px;line-height:1.3;margin:3px 0 7px">${esc(p.nome)}</div>
      <div class="val" style="font-size:19px">${moeda(p.vgv)}</div>
      <div class="sub">${nfu(p.qtd)} unidade${p.qtd===1?"":"s"} · ${pct1(c.totVgv?p.vgv/c.totVgv:null)} do canal ·
        ticket ${p.qtd?moeda(p.vgv/p.qtd):"—"}<br>
        Principal gerente: <b>${esc((maiorDe(p.gers)||["—"])[0])}</b> ·
        ${nf(Object.keys(p.prods).length)} empreendimento(s)</div>
      <div class="track" style="margin-top:9px"><div class="barfill"
        style="width:${Math.min(c.totVgv?p.vgv/c.totVgv:0,1)*100}%;background:${["var(--s1)","var(--s2)","var(--s3)"][i]}"></div></div>
    </div>`).join("")}</div>`:""}

  <div class="card" style="margin-bottom:13px"><div class="hd"><div class="h">Leitura rápida</div></div>
    <div class="sub" style="font-size:12.5px;line-height:1.65">
      ${reais.length?`A carteira tem <b>${nf(reais.length)}</b> parceiro${reais.length===1?"":"s"} com venda no período e
      <b>${nf(conc.n)}</b> deles concentra${conc.n===1?"":"m"} 80% do VGV.
      O maior sozinho responde por <b>${pct1(dep)}</b> — ${dep>=0.35
        ? "é dependência alta: uma troca de time nesse parceiro mexe no resultado do canal inteiro, e vale ter um segundo nome sendo construído para o mesmo produto."
        : dep>=0.2 ? "é uma liderança saudável, sem dependência crítica."
        : "a carteira está pulverizada, o que protege o resultado mas encarece o relacionamento."}
      ${parados.length?`<br>Dentro desse núcleo, <b>${nf(parados.length)}</b> parceiro${parados.length===1?" está":"s estão"} sem vender há mais
        de 60 dias (${parados.slice(0,3).map(p=>esc(p.nome)+" · "+moeda(p.vgv)).join("; ")}${parados.length>3?` e mais ${nf(parados.length-3)}`:""}).
        São relacionamentos que já provaram que convertem e pararam de girar — reativar costuma custar
        menos e fechar mais rápido do que prospectar nome novo.`
        :`<br>Nenhum parceiro do núcleo está parado há mais de 60 dias: a carteira que sustenta o resultado
        segue girando.`}
      ${c.semp?`<br><b>${moeda(c.semp.vgv)}</b> em ${nfu(c.semp.qtd)} unidade(s) estão sem parceiro preenchido na Base:

    </tbody></table></div>
    <div class="sub" style="margin-top:11px"><b>Share</b> é a fatia do VGV de Parcerias no período —
      inclusive o que está sem parceiro preenchido, por isso a soma dos parceiros nomeados não fecha 100%.
      <b>Principal gerente</b> é quem mais vendeu com aquele parceiro, e o percentual abaixo diz o quanto
      daquele parceiro passa por ele.</div></div>`;

  document.querySelectorAll("#pCorpo tr[data-parc]").forEach(tr=>{
    const n=tr.dataset.parc;
    const ab=tr.querySelector("[data-abrir]");
    if(ab) ab.addEventListener("click",()=>modalVendas(n,`Parcerias${rotParc()} · vendas do período`,
      vendasDoParceiro(n)));
    const ex=tr.querySelector("[data-exp]");
    if(ex) ex.addEventListener("click",()=>{
      const item=(c.lista||[]).find(x=>x.nome===n);
      abrir({titulo:n,sub:`Parcerias${rotParc()} · VGV mês a mês`,
        html:`<div style="padding:16px 17px">
          <div style="display:flex;justify-content:flex-end;margin-bottom:10px">${btnForma("pmG")}</div>
          <div id="pmG"></div></div>`,
        render(){ desenhaForma("pmG",{series:[{nome:"VGV realizado",valores:item.mes,cor:"var(--s3)"}],
          aria:n,aoClicar:mi=>modalVendas(`${n} · ${MESL[mi]}`,"Vendas do mês",
            vendasDoParceiro(n,{mes:mi}),true)}); }},true);
    });
  });
}
/* mesma régua de "há N dias" dos gerentes, mas com a data de referência
   passada de fora — aqui o período é outro */
function ultVendaRef(iso,ref){
  if(!iso) return '<span style="color:var(--muted)">sem venda</span>';
  const d=diasEntre(iso,ref);
  const cor=d==null?"var(--muted)":d>60?"var(--bad)":d>30?"var(--warn)":"var(--ink-2)";
  return `${dtBR(iso)}<span style="display:block;font-size:10px;color:${cor}">${
    d==null?"":d<=0?"hoje":d===1?"há 1 dia":`há ${nf(d)} dias`}</span>`;
}

/* ---- 6.2 · matrizes ---------------------------------------------------
   As três matrizes são o mesmo desenho do "Quem vendeu o quê": número
   grande = unidades, percentual = fatia da coluna, fundo = VGV. Escrever
   uma função só evita que elas comecem iguais e terminem diferentes.

   Uma matriz de 65 linhas não se lê. Por padrão mostra os 20 maiores e um
   botão abre o resto — o total do rodapé é sempre do recorte inteiro, para
   ninguém somar a tela e achar que falta dinheiro.                        */
function matrizParc(o){
  const {lista,semp}=o.ctx;
  const reais=soParceiros(lista);
  const todos=reais.concat(semp?[semp]:[]);
  const mostra=(parcTodos||todos.length<=20)?todos:todos.slice(0,20);
  const escondidos=todos.length-mostra.length;
  const cols=o.cols;
  const cel={},qtd={},totCol={},vgvCol={};
  o.ctx.rows.forEach(t=>{
    const cc=o.colDe(t); if(cc==null||cols.indexOf(cc)<0) return;
    const k=nomeParc(t)+"||"+cc;
    cel[k]=(cel[k]||0)+t.valor; qtd[k]=(qtd[k]||0)+(t.peso||0);
    totCol[cc]=(totCol[cc]||0)+(t.peso||0); vgvCol[cc]=(vgvCol[cc]||0)+t.valor;
  });
  const max=Math.max(1,...Object.values(cel));
  const totQtd=Object.values(qtd).reduce((s,v)=>s+v,0)||1;
  const totVgv=Object.values(cel).reduce((s,v)=>s+v,0);

  document.getElementById("pCorpo").innerHTML=`
  <div class="card"><div class="hd"><div class="h">${esc(o.titulo)}${esc(rotParc())}</div>
    <div class="sub">${o.sub}</div></div>
    <div class="scroll"><table class="tb num"><thead><tr><th class="stickyc">Parceiro</th>
      ${cols.map(cc=>`<th class="c" style="font-size:9.5px;white-space:normal;max-width:88px">${esc(o.rotCol(cc))}
        <span style="display:block;font-weight:400;opacity:.7">${nfu(totCol[cc]||0)} un</span></th>`).join("")}
      <th class="r">Total</th><th class="r">VGV</th></tr></thead>
    <tbody>${mostra.map(p=>{
      const tq=cols.reduce((s,cc)=>s+(qtd[p.nome+"||"+cc]||0),0);
      return `<tr><td class="nm stickyc" style="${semParc(p.nome)?"color:var(--muted)":""}">${esc(p.nome)}</td>
      ${cols.map(cc=>{ const k=p.nome+"||"+cc, v=cel[k]||0, n=qtd[k]||0;
        const sh=totCol[cc]?n/totCol[cc]:0;
        const int=v?Math.round((0.12+0.88*(v/max))*72):0;
        return `<td class="c" ${v?`style="cursor:pointer;padding:6px 8px;background:color-mix(in srgb,var(--s3) ${int}%,transparent)"
          data-pc="${esc(p.nome)}" data-cc="${esc(String(cc))}"
          data-tip="<b>${esc(p.nome)}</b> → ${esc(o.rotCol(cc))}<br><b>${nfu(n)}</b> unidade(s) · <b>${pct1(sh)}</b> ${esc(o.oQue)}<br>VGV: <b>${moeda(v)}</b><br><span style='color:var(--muted)'>clique para abrir</span>">
          <b style="font-size:13px">${nfu(n)}</b>
          <span style="display:block;font-size:10px;color:var(--ink-2)">${pct1(sh)}</span>`
          :'style="color:var(--muted)">·'}</td>`; }).join("")}
      <td class="r"><b>${nfu(tq)}</b><span style="display:block;font-size:10px;color:var(--ink-2);font-weight:400">${pct1(tq/totQtd)}</span></td>
      <td class="r"><b>${moeda(p.vgv)}</b></td></tr>`; }).join("")}
      <tr class="tot"><td class="stickyc">Total</td>
        ${cols.map(cc=>`<td class="c">${nfu(totCol[cc]||0)}<span style="display:block;font-size:10px;font-weight:400">100%</span></td>`).join("")}
        <td class="r">${nfu(totQtd)}<span style="display:block;font-size:10px;font-weight:400">100%</span></td>
        <td class="r">${moeda(totVgv)}</td></tr>
    </tbody></table></div>
    ${escondidos>0?`<div style="margin-top:11px"><button class="preset" id="pMais" type="button">Mostrar os ${nf(escondidos)} parceiros restantes</button></div>`
      :(parcTodos&&todos.length>20?`<div style="margin-top:11px"><button class="preset" id="pMenos" type="button">Mostrar só os 20 maiores</button></div>`:"")}
    <div class="sub" style="margin-top:11px">O número grande é a <b>quantidade de unidades</b> e o percentual
      abaixo é a fatia daquela coluna — cada coluna fecha 100%. O tom de fundo é o <b>VGV</b>, então dá para
      separar quem vende muita unidade pequena de quem vende poucas unidades grandes.
      ${escondidos>0?`A tabela mostra os 20 maiores; o rodapé de <b>Total</b> continua sendo do recorte inteiro.`:""}</div>
  </div>`;

  const bm=document.getElementById("pMais");
  if(bm) bm.addEventListener("click",()=>{ parcTodos=true; rParceiros(); });
  const bn=document.getElementById("pMenos");
  if(bn) bn.addEventListener("click",()=>{ parcTodos=false; rParceiros(); });
  document.querySelectorAll("#pCorpo td[data-pc]").forEach(td=>td.addEventListener("click",()=>{
    const n=td.dataset.pc, cc=o.valCol(td.dataset.cc);
    modalVendas(`${n} · ${o.rotCol(cc)}`,o.titulo,
      vendasDoParceiro(n,o.filtroCol(cc)));
  }));
}

   7 · ORIGEM POR EMPREENDIMENTO
   ===================================================================== */
const CANAIS_MKT=["Salão","Online"];   // a análise de origem olha só os canais próprios
const perOrigem=novoPeriodo();
const VO=[{id:"porprod",rot:"Origem por empreendimento"},{id:"resumo",rot:"Resumo por empreendimento"},
  {id:"plataforma",rot:"Plataformas"},{id:"origem",rot:"Ranking de origens"},
  {id:"campanha",rot:"Campanhas"},{id:"matriz",rot:"Origem × empreendimento"}];
let vOrig="porprod", prodSel="";

/* ---- linha de campanha -------------------------------------------------
   O nome da campanha carrega a linha criativa dentro dele, tipo
   "Frei Caneca - Linha Investidor - Lookalike". Pegamos o trecho que começa
   em "Linha" e vai até o próximo separador. Campanha sem "Linha" no nome
   fica como "Sem linha identificada" — nada é inventado.                  */
function linhaDaCampanha(c){
  if(!c) return null;
  const m=String(c).match(/linha\s+[^|\-–—]+/i);
  return m ? m[0].trim().replace(/\s+/g," ") : null;
}
const kLinha=s=>kk(s).replace(/[()]/g,"");
/* distância de edição, para avisar sobre nomes quase iguais na planilha */
function dist(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++) m[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
/* ---------------------------------------------------------------------
   Escopo da aba Origem — duas réguas, sempre as duas à vista.

   A base é TODA venda de unidade do empreendimento (vaga, peso 0, fica de
   fora: não nasce de captação nenhuma). Dentro dela, só Salão e Online têm
   origem de captação — em Parcerias e Lançadora o campo Origem repete o
   nome do canal, não é informação de captação. Por isso esses canais não
   entram no ranking de origens, mas ENTRAM no denominador.

   Sem isso o Online do Frei Caneca aparecia com 34,4%, que é a fatia dele
   entre o que nós captamos; do empreendimento inteiro ele é 13,5%, porque
   Parcerias sozinha responde por 58,2%. As duas leituras são verdadeiras —
   o erro era mostrar uma sem dizer qual.

   A classificação é pelo CANAL, nunca pelo texto do campo Origem: existe
   venda de Salão com origem digitada como "Parcerias", e ela tem que
   continuar contando como captação nossa.
   --------------------------------------------------------------------- */
const soMkt=t=>CANAIS_MKT.includes(t.canal)&&!!t.peso;   // captação própria
const naBase=t=>!!t.peso;                                 // toda unidade vendida
const semCap=t=>naBase(t)&&!soMkt(t);                     // canal sem captação
const canaisSemCap=rows=>Array.from(new Set(rows.filter(semCap).map(t=>t.canal)));
/* "Parcerias, Lançadora e Interna" — vírgula até o penúltimo, "e" no último */
const listaPt=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];

function agrupar(rows,campoFn){
  const acc={};
  rows.forEach(t=>{ const k=campoFn(t); if(k==null) return;
    (acc[k]=acc[k]||{nome:k,vgv:0,vendas:0}); acc[k].vgv+=t.valor; acc[k].vendas+=(t.peso||0); });
  return Object.values(acc).map(x=>({...x,ticket:x.vgv/x.vendas})).sort((a,b)=>b.vgv-a.vgv);
}

        nesses canais o campo Origem só repete o nome do canal, não diz de onde veio o cliente.

/* Tabela de representatividade.
   `total` é o denominador principal (todas as vendas do recorte) e `cap` o da
   captação própria. `semCap` é a linha do que não tem origem — ela existe para
   a coluna fechar 100%: share que não soma é a primeira coisa que gera dúvida. */
function tabelaShare(itens,rotulo,total,cor,opts){
  const o=opts||{};
  const totV=itens.reduce((s,i)=>s+i.vgv,0)+(o.semCap?o.semCap.vgv:0)||1;
  const max=Math.max(1,...itens.map(i=>i.vendas));
  if(!itens.length&&!o.semCap) return `<div class="empty">Nada registrado neste recorte.</div>`;
  const colCap=o.cap!=null;
  return `<div class="scroll"><table class="tb num"><thead><tr>
      <th class="stickyc">${rotulo}</th><th class="r">Vendas</th><th class="r">Share do total</th>
      ${colCap?'<th class="r">Share da captação</th>':""}
      <th class="r">VGV</th><th class="r">Ticket</th><th></th></tr></thead>
    <tbody>${itens.map(i=>`<tr class="clickable" data-k="${esc(i.nome)}">
      <td class="nm stickyc">${esc(i.nome)}</td>
      <td class="r"><b>${nfu(i.vendas)}</b></td>
      <td class="r"><b>${pct1(i.vendas/total)}</b></td>
      ${colCap?`<td class="r" style="color:var(--ink-2)">${o.cap?pct1(i.vendas/o.cap):"—"}</td>`:""}
      <td class="r">${moeda(i.vgv)}</td>
      <td class="r">${moeda(i.ticket)}</td>
      <td style="width:140px"><div class="track" style="height:7px">
        <div class="barfill" style="width:${(i.vendas/max)*100}%;background:${cor}"></div></div></td>
    </tr>`).join("")}
    ${o.semCap?`<tr class="clickable" data-semcap="1" style="background:var(--card-2)">
      <td class="nm stickyc" style="font-style:italic;color:var(--ink-2)">Sem origem de captação

}

/* Aviso padrão da aba: quanto do recorte não tem origem de captação. */
function avisoSemCap(rows){
  const fora=rows.filter(semCap), tot=unid(rows);
  if(!fora.length||!tot) return "";
  return `<div class="sub" style="margin-bottom:12px;padding:9px 11px;border-radius:9px;
    background:var(--warn-bg);color:var(--warn)"><b>${pct1(unid(fora)/tot)}</b> das vendas deste recorte
    vieram de <b>${listaPt(canaisSemCap(rows))}</b> e não têm origem de captação — entram no denominador,
    mas ficam fora do ranking de origens.</div>`;
}

/* ---------- Origem por empreendimento: a visão principal da aba ---------- */
function pintaOrigemPorProduto(el,todas,mkt,T){
  const comVenda=PRODUTOS.filter(p=>todas.some(t=>t.produto===p));
  if(prodSel && !comVenda.includes(prodSel)) prodSel="";
  const tudo=prodSel?todas.filter(t=>t.produto===prodSel):todas;   // base: todas as vendas
  const escopo=tudo.filter(soMkt);                                  // só a captação própria
  const fora=tudo.filter(semCap);
  T("Origem por empreendimento",
    "De onde nasceu cada venda · o share é sobre todas as vendas do empreendimento, com Parcerias e Lançadora no denominador");

  const total=unid(tudo)||1;      // denominador principal
  const totalCap=unid(escopo);    // denominador da captação
  const origens=agrupar(escopo,t=>t.origem||"Não informada");
  const lider=origens[0];
  const comCamp=escopo.filter(t=>t.campanha);
  const camps=agrupar(comCamp,t=>t.campanha);
  // linhas de campanha, agrupadas por nome normalizado
  const porLinha={};
  comCamp.forEach(t=>{
    const l=linhaDaCampanha(t.campanha)||"Sem linha identificada";
    const k=kLinha(l);
    porLinha[k]=porLinha[k]||{nome:l,vendas:0,vgv:0,variantes:{}};
    porLinha[k].vendas+=(t.peso||0); porLinha[k].vgv+=t.valor;
    porLinha[k].variantes[l]=(porLinha[k].variantes[l]||0)+1;
  });
  const linhasC=Object.values(porLinha).map(x=>({...x,ticket:x.vgv/x.vendas}))
    .sort((a,b)=>b.vendas-a.vendas);
  // avisa sobre nomes quase iguais (erro de digitação na planilha)
  const chaves=Object.keys(porLinha).filter(k=>k!==kLinha("Sem linha identificada"));
  const parecidos=[];
  for(let i=0;i<chaves.length;i++) for(let j=i+1;j<chaves.length;j++)
    if(dist(chaves[i],chaves[j])<=2) parecidos.push([porLinha[chaves[i]].nome,porLinha[chaves[j]].nome]);

  const chip=(v,r,n)=>`<button class="preset ${prodSel===v?"on":""}" data-p="${esc(v)}"
    style="${prodSel===v?"background:var(--gold);border-color:var(--gold);color:#14161a;font-weight:700":""}">
    ${esc(r)}${n!=null?` <span style="opacity:.7">${n}</span>`:""}</button>`;

  el.innerHTML=`
  <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">
    ${chip("","Todos os empreendimentos",nfu(unid(todas)))}
    ${comVenda.map(p=>chip(p,p,nfu(unid(todas.filter(t=>t.produto===p))))).join("")}
  </div>

  ${avisoSemCap(tudo)}

  <div class="grid g3" style="margin-bottom:14px">
    <div class="card kpi" style="background:var(--card-2)"><div class="lab">${prodSel?esc(prodSel):"Todos os empreendimentos"}</div>
      <div class="val sm">${nfu(total)} unidades</div>
      <div class="sub">${moeda(soma(tudo))} em VGV · <b>${nfu(totalCap)}</b> de captação própria
        (<b>${pct1(totalCap/total)}</b>)</div></div>
    <div class="card kpi" style="background:var(--card-2)"><div class="lab">Origem que mais gerou venda</div>
      <div class="val sm">${lider?esc(lider.nome):"—"}</div>
      <div class="sub">${lider?`<b>${nfu(lider.vendas)}</b> unidades · <b>${pct1(lider.vendas/total)}</b> do
        empreendimento · ${pct1(totalCap?lider.vendas/totalCap:0)} da captação`:""}</div></div>
    <div class="card kpi" style="background:var(--card-2)"><div class="lab">Vendas atribuídas a campanha</div>
      <div class="val sm">${nfu(unid(comCamp))}</div>
      <div class="sub"><b>${pct1(unid(comCamp)/total)}</b> do empreendimento · ${nf(camps.length)} campanhas
        e ${nf(linhasC.length)} linhas distintas</div></div>
  </div>

  <div class="card" style="margin-bottom:13px">
    <div class="hd"><div class="h">Todas as origens${prodSel?` · ${esc(prodSel)}`:""}</div>
      <div class="sub">Share do total inclui Parcerias e Lançadora no denominador; share da captação
        olha só Salão e Online · clique na linha para abrir as vendas</div></div>
    <div id="opOrig"></div>
  </div>

  <div class="grid g2">
    <div class="card"><div class="hd"><div class="h">Campanhas</div>
      <div class="sub">Composição das <b>${nf(comCamp.length)}</b> vendas com campanha registrada</div></div>
      <div id="opCamp"></div></div>
    <div class="card"><div class="hd"><div class="h">Linhas de campanha</div>
      <div class="sub">A linha criativa extraída do nome da campanha · "sem linha" são campanhas
        cujo nome não traz uma linha, como Site Planik e Google Adwords</div></div>
      <div id="opLinha"></div>
      ${(parecidos.length&&podeEditarCfg())?`<div class="sub" style="margin-top:11px;color:var(--warn)">
        <b>Atenção ao cadastro.</b> Estes nomes são quase idênticos e por isso contam separado:
        ${parecidos.map(([a,b])=>`"${esc(a)}" e "${esc(b)}"`).join("; ")}.
        Padronizar o nome na planilha consolida as duas linhas numa só.</div>`:""}
    </div>
  </div>`;

  document.getElementById("opOrig").innerHTML=tabelaShare(origens,"Origem",total,"var(--s1)",
    {cap:totalCap, semCap: fora.length?{vendas:unid(fora),vgv:soma(fora),canais:canaisSemCap(tudo).join(", ")}:null});
  document.getElementById("opCamp").innerHTML=comCamp.length
    ? tabelaShare(camps,"Campanha",unid(comCamp),"var(--s3)")
    : `<div class="empty">Nenhuma venda com campanha registrada neste recorte.</div>`;
  document.getElementById("opLinha").innerHTML=comCamp.length
    ? tabelaShare(linhasC,"Linha",unid(comCamp),"var(--s3)")
    : `<div class="empty">Nenhuma venda com campanha registrada neste recorte.</div>`;

  el.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{
    prodSel=b.dataset.p; pintaVistaOrigem(); }));
  const base=prodSel?{produto:prodSel}:{};
  document.querySelectorAll("#opOrig tr[data-k]").forEach(tr=>tr.addEventListener("click",()=>
    modalVendas(`${tr.dataset.k}${prodSel?" · "+prodSel:""}`,"Origem · captação própria",
      escopo.filter(t=>(t.origem||"Não informada")===tr.dataset.k))));
  const trSem=document.querySelector("#opOrig tr[data-semcap]");
  if(trSem) trSem.addEventListener("click",()=>modalVendas(
    `Sem origem de captação${prodSel?" · "+prodSel:""}`,canaisSemCap(tudo).join(", "),fora));
  document.querySelectorAll("#opCamp tr[data-k]").forEach(tr=>tr.addEventListener("click",()=>
    modalVendas(`${tr.dataset.k}${prodSel?" · "+prodSel:""}`,"Campanha · Salão e Online",
      escopo.filter(t=>t.campanha===tr.dataset.k))));
  document.querySelectorAll("#opLinha tr[data-k]").forEach(tr=>tr.addEventListener("click",()=>{
    const alvo=kLinha(tr.dataset.k);
    modalVendas(`${tr.dataset.k}${prodSel?" · "+prodSel:""}`,"Linha de campanha · Salão e Online",
      escopo.filter(t=>t.campanha &&
        kLinha(linhaDaCampanha(t.campanha)||"Sem linha identificada")===alvo));
  }));
}

   7 · VSO

/* ---------------------------------------------------------------------
   Linhas de produto. Os nomes são casados por chave normalizada (kk), então
   NIK/Nik/NIK FREI CANECA dão no mesmo. Empreendimento novo que não estiver
   em nenhuma linha continua aparecendo em "Todas" e é avisado na tela — some
   da visão por linha, mas não some do relatório em silêncio.
   --------------------------------------------------------------------- */
const LINHAS=[
  {id:"todas",rot:"Todas as linhas",itens:null},
  {id:"nik",  rot:"Linha NIK", itens:["NIK Paulista","NIK Paradiso","NIK Sunset Paulista",
     "NIK Estilo Paulista","NIK Faria Lima","NIK Vila Mariana","NIK Frei Caneca"]},
  {id:"medio",rot:"Médio alto", itens:["Core Klabin","Linn Vila Mariana"]},
  {id:"alto", rot:"Alto padrão", itens:["Taj Ibirapuera","Nuv Moema"]},
];
let vLinha="todas";
/* produtos da linha escolhida, na ordem oficial */
function prodsDaLinha(id){
  const L=LINHAS.find(x=>x.id===(id||vLinha));
  if(!L||!L.itens) return PRODUTOS.slice();
  const alvo=new Set(L.itens.map(kk));
  return PRODUTOS.filter(p=>alvo.has(kk(p)));
}
/* empreendimentos que não caíram em nenhuma linha */
const SEMLINHA=(function(){
  const cobertos=new Set(LINHAS.filter(l=>l.itens).flatMap(l=>l.itens.map(kk)));
  return PRODUTOS.filter(p=>!cobertos.has(kk(p)));
})();

/* ---------------------------------------------------------------------
   Recortes de VSO — exatamente os que existem na aba "VSOs 2026".

   Esta aba deixou de calcular e passou a ESPELHAR a planilha. O motivo é que
   o denominador dela não sai da Base: a planilha considera distrato,
   reentrada de unidade e reajuste de tabela ao longo do ano, e a Base só tem
   a venda. Recalculando aqui, o site dava um número e o Excel dava outro —
   e numa reunião quem perde é sempre o site.

   Consequência assumida: o recorte "Ato pago" não afeta esta aba (a planilha
   não tem esse corte) e o período livre saiu de cena, porque a planilha
   fecha VSO em ano e trimestre, não em data arbitrária. As duas coisas estão
   ditas na tela, não escondidas.
   --------------------------------------------------------------------- */
const RECORTES_VSO=[
  {id:"ytd",rot:"Ano até agora",bloco:null,meses:null},
  {id:"t1", rot:"1º tri", bloco:"t1", meses:[0,1,2]},
  {id:"t2", rot:"2º tri", bloco:"t2", meses:[3,4,5]},
  {id:"t3", rot:"3º tri", bloco:"t3", meses:[6,7,8]},
  {id:"t4", rot:"4º tri", bloco:"t4", meses:[9,10,11]},
];
let vRec="ytd";
function recorteVSO(){ return RECORTES_VSO.find(r=>r.id===vRec)||RECORTES_VSO[0]; }
/* o bloco da planilha correspondente ao recorte escolhido */
function blocoVSO(){
  const V=D.vso||{}, r=recorteVSO();
  return (r.bloco ? ((V.trimestres||{})[r.bloco]||{}) : (V.anoYTD||{}));
}
/* meses que o recorte cobre; no YTD vai até o mês de referência */
function mesesVSO(){
  const r=recorteVSO();
  return new Set(r.meses||Array.from({length:MESREF},(_,i)=>i));
}

function rVSO(){
  const r=recorteVSO();
  $("#p-vso").innerHTML=`
    <div class="card" style="margin-bottom:13px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="tgl" id="pvRec">
          ${RECORTES_VSO.map(x=>`<button data-r="${x.id}" class="${x.id===vRec?"on":""}">${x.rot}</button>`).join("")}
        </div>
        <div class="tgl" id="pvLinha" style="margin-left:auto">

        </div>
      </div>
      <div class="sub" style="margin-top:8px">Os números desta aba vêm prontos da aba
        <b>VSOs 2026</b> da planilha — os doze quadros mensais e os cálculos de ano e de
        trimestre. Não são recalculados aqui, para não divergirem do seu Excel.${
        SEMLINHA.length?` <b style="color:var(--warn)">${SEMLINHA.join(", ")}</b> ainda não
        ${SEMLINHA.length>1?"estão":"está"} em nenhuma linha e só aparece${SEMLINHA.length>1?"m":""}
        em "Todas as linhas".`:""}</div>
      ${ATO==="pago"?`<div class="avisoacesso" style="margin:11px 0 0">O recorte
        <b>Ato pago</b> não vale nesta aba: a planilha calcula o VSO sem esse corte, e
        reescalar aqui faria o site divergir dela. Os números abaixo são sempre do
        recorte <b>Geral</b>.</div>`:""}</div>
    <div id="pvCorpo"></div>`;
  document.getElementById("pvRec").addEventListener("click",e=>{
    const b=e.target.closest("button[data-r]"); if(!b||b.dataset.r===vRec) return;
    vRec=b.dataset.r;

    pintaVSO();
  });
  document.getElementById("pvLinha").addEventListener("click",e=>{

    vLinha=b.dataset.l;
    document.querySelectorAll("#pvLinha button").forEach(x=>x.classList.toggle("on",x.dataset.l===vLinha));
    pintaVSO();

  pintaVSO();
}

function pintaVSO(){
  const V=D.vso||{}, BL=blocoVSO(), r=recorteVSO();
  const LIN=prodsDaLinha();
  const DISP=V.mensalDisponivel||{}, VEND=V.mensalVendido||{};
  const ms=mesesVSO();

  /* Série mensal da linha escolhida. Em "Todas as linhas" usamos a linha Total
     da própria planilha; nas outras, somamos vendido e disponível dos
     empreendimentos da linha e dividimos — média de VSO não é VSO. */
  const totalPlanilha=(V.mensalTotal||[]).slice();
  const mensalT=(vLinha==="todas") ? totalPlanilha : Array.from({length:12},(_,i)=>{
    let d=0,v=0,tem=false;
    LIN.forEach(p=>{ const dd=(DISP[p]||[])[i]; if(dd==null) return;
      tem=true; d+=dd; v+=((VEND[p]||[])[i]||0); });
    return (!tem||!d)?null:v/d;
  });
  const porProd=V.mensalPorProduto||{};

  /* Total do recorte: a linha TOTAL da planilha quando é a carteira inteira;
     soma dos empreendimentos da linha quando é um recorte de produto. */
  const totalBloco=BL.TOTAL||BL.Total||null;
  const prods=LIN.filter(p=>BL[p]||porProd[p]);
  const iniLinha=(vLinha==="todas"&&totalBloco)?totalBloco.inicio
    :prods.reduce((s,p)=>s+((BL[p]||{}).inicio||0),0);
  const vendLinha=(vLinha==="todas"&&totalBloco)?totalBloco.vendas
    :prods.reduce((s,p)=>s+((BL[p]||{}).vendas||0),0);
  const vsoLinha=(vLinha==="todas"&&totalBloco&&totalBloco.vso!=null)?totalBloco.vso
    :(iniLinha?vendLinha/iniLinha:null);

  /* Unidades vêm da Base — a planilha não conta unidade nesta aba. Fica numa
     coluna própria e avisada, para ninguém achar que saiu do mesmo lugar. */
  const unidades={};
  TX.forEach(t=>{ if(!t.peso||!ms.has(t.mes)) return;
    unidades[t.produto]=(unidades[t.produto]||0)+t.peso; });

  const rank=prods.slice().sort((a,b)=>(unidades[b]||0)-(unidades[a]||0));
  const maisLiq=rank[0], menosLiq=rank[rank.length-1];
  const mensal=mensalT.map((v,i)=>ms.has(i)?v:null);
  const iMax=mensal.reduce((b,v,i)=>(v!=null&&v>0&&(b<0||v>mensal[b]))?i:b,-1);
  const vsoDe=p=>{ const a=BL[p]; return a&&a.vso!=null?a.vso:null; };

  document.getElementById("pvCorpo").innerHTML=`
  <div class="grid g4" style="margin-bottom:13px">
    <div class="card kpi"><div class="lab">VSO · ${esc(r.rot)}</div>
      <div class="val lg">${vsoLinha!=null?nf(vsoLinha*100,2)+"%":"—"}</div>
      <div class="sub">Vendas de <b>${moeda(vendLinha)}</b><br>
        sobre estoque inicial de <b>${moeda(iniLinha)}</b><br>
        <span style="color:var(--muted)">direto da aba VSOs 2026</span></div></div>
    <div class="card kpi"><div class="lab">Melhor mês do recorte</div>
      ${iMax<0?'<div class="val">—</div>':`<div class="val">${nf(mensal[iMax]*100,2)}%</div>
      <div class="sub"><b>${MESL[iMax]}</b> foi o mês de maior velocidade de vendas</div>`}</div>
    <div class="card kpi"><div class="lab">Mais líquido · em unidades</div>
      <div class="val sm">${esc(maisLiq||"—")}</div>
      <div class="sub"><b>${nfu(unidades[maisLiq]||0)}</b> unidades vendidas no recorte<br>
        VSO <b>${vsoDe(maisLiq)!=null?nf(vsoDe(maisLiq)*100,1)+"%":"—"}</b></div></div>
    <div class="card kpi"><div class="lab">Menos líquido · em unidades</div>
      <div class="val sm">${esc(menosLiq||"—")}</div>
      <div class="sub"><b>${nfu(unidades[menosLiq]||0)}</b> unidades vendidas no recorte<br>
        VSO <b>${vsoDe(menosLiq)!=null?nf(vsoDe(menosLiq)*100,1)+"%":"—"}</b></div></div>
  </div>
  <div class="card" style="margin-bottom:13px">
    <div class="hd" style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><div class="h">VSO mês a mês · ${vLinha==="todas"?"carteira consolidada":esc((LINHAS.find(l=>l.id===vLinha)||{}).rot)}</div>
        <div class="sub">Percentual do estoque disponível vendido em cada mês, como está nos
          doze quadros da planilha · meses fora do recorte aparecem esmaecidos</div></div>
      ${btnForma("vsoG")}</div>
    <div id="vsoG"></div></div>
  <div class="card" data-cart="vso"><div class="hd"><div class="h">VSO por empreendimento · ${esc(r.rot)}</div>
    <div class="sub">Estoque inicial, vendas e VSO como a planilha calcula · clique no nome
      para as vendas da Base, ou no <b>gráfico</b> para ampliar a evolução</div></div>
    <div class="scroll"><table class="tb num"><thead><tr><th class="stickyc">Empreendimento</th>
      <th class="r">Estoque inicial</th><th class="r">Vendas</th>
      <th class="r">VSO ${esc(r.rot)}</th><th class="r">VSO ano</th>
      <th class="r">Un. (Base)</th><th>Evolução</th>
      ${MES.map(m=>`<th class="c">${m}</th>`).join("")}</tr></thead>
    <tbody>${prods.map(p=>{ const a=BL[p]||{}, s=porProd[p]||[];
      const an=((V.anoYTD||{})[p]||{}).vso;
      return `<tr data-p="${esc(p)}"><td class="nm stickyc"><span class="lnk" data-abrir="1">${esc(p)}</span></td>
        <td class="r">${a.inicio!=null?moeda(a.inicio):"—"}</td>
        <td class="r">${a.vendas!=null?moeda(a.vendas):"—"}</td>
        <td class="r"><b>${a.vso!=null?nf(a.vso*100,2)+"%":"—"}</b></td>
        <td class="r" style="color:var(--muted)">${an!=null?nf(an*100,2)+"%":"—"}</td>
        <td class="r" style="color:var(--muted)">${nfu(unidades[p]||0)}</td>
        <td><span class="spark" data-exp="1" title="Ampliar">${spark(s.map(v=>v==null?0:v*1000),"var(--s1)")}</span></td>
        ${s.concat(Array(12).fill(null)).slice(0,12).map((v,i)=>`<td class="c" style="font-size:11.5px;${v==null||!ms.has(i)?"color:var(--muted);opacity:.55":""}">${v==null?"·":nf(v*100,1)+"%"}</td>`).join("")}
      </tr>`; }).join("")}
      ${totalBloco&&vLinha==="todas"?`<tr class="tot"><td class="stickyc">Total</td>
        <td class="r">${moeda(totalBloco.inicio)}</td><td class="r">${moeda(totalBloco.vendas)}</td>
        <td class="r">${totalBloco.vso!=null?nf(totalBloco.vso*100,2)+"%":"—"}</td>
        <td class="r"></td><td class="r"></td><td></td>
        ${MES.map(()=>"<td></td>").join("")}</tr>`:""}
    </tbody></table></div>
    <div class="sub" style="margin-top:11px">Estoque inicial, vendas e VSO saem da aba
      <b>VSOs 2026</b>. A coluna <b>Un. (Base)</b> é a única calculada aqui, a partir do
      extrato de vendas, porque a planilha não conta unidade neste bloco.</div></div>`;

  /* gráfico mês a mês, com a mesma série em barra ou em linha */
  desenhaForma("vsoG",{
    valores:mensal, fantasma:mensalT, meses:12, cor:"var(--s1)",
    fmt:v=>nf(v*100,2)+"%", rot:v=>nf(v*100,1)+"%",
    aria:"VSO mês a mês", destaque:MESREF-1,
  });

  document.querySelectorAll("#pvCorpo tr[data-p]").forEach(tr=>{
    const p=tr.dataset.p;
    tr.querySelector("[data-abrir]").addEventListener("click",()=>
      modalVendas(p,`Vendas de ${ANO} · ${r.rot}`,
        TX.filter(t=>t.produto===p&&ms.has(t.mes))));
    tr.querySelector("[data-exp]").addEventListener("click",()=>{
      const s=(porProd[p]||[]).map(v=>v==null?null:v*100);
      abrir({titulo:p,sub:"VSO mês a mês · percentual do estoque disponível vendido · direto da planilha",
        html:`<div style="padding:16px 17px">
          <div style="display:flex;justify-content:flex-end;margin-bottom:8px">${btnForma("vsoM")}</div>
          <div id="vsoM"></div>
          <div class="legend"><span class="it"><span class="dot" style="background:var(--s1)"></span>VSO (%)</span>
          <span class="it" style="color:var(--muted)">clique num mês para abrir as vendas</span></div></div>`,
        rodape:`<span>VSO do ano <b>${((V.anoYTD||{})[p]||{}).vso!=null?nf((V.anoYTD||{})[p].vso*100,2)+"%":"—"}</b></span>
                <span>Unidades no recorte <b>${nfu(unidades[p]||0)}</b></span>`,
        render(){
          desenhaForma("vsoM",{valores:s,meses:12,cor:"var(--s1)",
            fmt:v=>nf(v,2)+"%", rot:v=>nf(v,1)+"%", aria:"VSO de "+p,
            aoClicar:mi=>modalVendas(`${MESL[mi]} · ${p}`,"Vendas do mês",
              TX.filter(t=>t.produto===p&&t.mes===mi),true)});
        }});
    });
  });
}


/* =====================================================================
   CELULAR — navegação inferior, folha do "Mais" e tabela em cartão

   O princípio que guia este bloco: **não recalcular nada**. Os cartões são
   montados a partir da tabela que já foi desenhada, lendo célula por célula.
   Se o número está certo na tabela, está certo no cartão — não existe uma
   segunda conta que possa divergir. E o clique do cartão é repassado para a
   linha original, então todo detalhamento que existe no computador continua
   existindo no telefone: mês, gerente, empreendimento, origem, unidade.

   O que muda de verdade é a forma. Uma tabela de treze colunas num aparelho
   de 390 px mostra duas; o mesmo conteúdo em cartão mostra tudo, empilhado.
   Quem quiser a tabela original tem o botão "Ver tabela" em cada bloco.
   ===================================================================== */

/* --- tabela em cartão --------------------------------------------------- */
/* Lê "R$ 1.234.567", "61,2%", "84,5" e devolve número. Devolve null no que
   não for número — o "—" e o "·" das células vazias caem aqui. */
function numDe(t){
  const s=String(t==null?"":t).replace(/ /g," ").trim();
  if(!s||/^[—–·-]$/.test(s)) return null;
  const m=s.replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".");
  const v=parseFloat(m);
  return isFinite(v)?(/%/.test(s)?v/100:v):null;
}
const RECEITAS={};        /* preenchido por registraReceita() */
function registraReceita(marca,rec){ RECEITAS[marca]=rec; }

/* Monta os cartões de um bloco. `card` é o .card que contém a tabela. */
function emCartoes(card){
  if(!card||card.dataset.emCartao==="1") return;
  const tab=card.querySelector("table.tb"); if(!tab) return;
  const corpo=tab.querySelector("tbody"); if(!corpo) return;
  const ths=Array.from(tab.querySelectorAll("thead th"))
    .map(t=>t.textContent.replace(/[▾▲▼]/g,"").trim());
  const linhas=Array.from(corpo.querySelectorAll("tr"));
  if(!linhas.length) return;
  const rec=RECEITAS[card.dataset.cart]||{};
  const iTit=rec.titulo!=null?rec.titulo:0;
  const nCols=ths.length||linhas[0].children.length;
  const iVal=rec.valor!=null?rec.valor:(nCols>1?1:0);
  /* A coluna que virou barra CONTINUA escrita na linha de apoio: a barra é
     leitura rápida, não substituição do número. Só o que já está desenhado
     célula a célula (mini gráfico e mapa de calor) sai do texto. */
  const pulados=new Set([iTit,iVal].concat(rec.ocultar||[]));
  if(rec.mini) for(let i=rec.mini[0];i<=rec.mini[1];i++) pulados.add(i);
  if(rec.heat) for(let i=rec.heat[0];i<=rec.heat[1];i++) pulados.add(i);

  const cx=document.createElement("div");
  cx.className="cartoes";
  linhas.forEach(tr=>{
    const tds=Array.from(tr.children);
    if(!tds.length) return;
    const total=tr.classList.contains("tot");
    const cel=i=>tds[i]?tds[i].textContent.trim():"";
    const c=document.createElement("div");
    c.className="cart"+(tr.classList.contains("clickable")||rec.clicar?" clicavel":"");
    if(total) c.style.background="var(--card-2)";
    const partes=[`<div class="l1"><span class="nome">${esc(cel(iTit))}</span>
      <span class="val">${esc(cel(iVal))}</span></div>`];
    if(rec.barra!=null){
      const p=numDe(cel(rec.barra));
      if(p!=null) partes.push(`<div class="track"><div class="barfill"
        style="width:${Math.min(Math.max(p,0),1)*100}%;background:${rec.corBarra||"var(--s1)"}"></div></div>`);
    }
    if(rec.mini){
      const vals=[],rots=[];
      for(let i=rec.mini[0];i<=rec.mini[1];i++){ vals.push(numDe(cel(i))||0); rots.push(ths[i]||""); }
      const mx=Math.max(1,...vals);
      partes.push(`<div class="mini">${vals.map((v,k)=>`<i data-col="${rec.mini[0]+k}"
        style="height:${Math.max(2,(v/mx)*30)}px;background:${v>0?(rec.corBarra||"var(--s2)"):"var(--grid)"}"
        title="${esc(rots[k]+": "+cel(rec.mini[0]+k))}"></i>`).join("")}</div>
        <div class="minirot">${rots.map(r=>`<span>${esc(r.slice(0,1))}</span>`).join("")}</div>`);
    }
    if(rec.heat){
      const q=[];
      for(let i=rec.heat[0];i<=rec.heat[1];i++){
        const v=numDe(cel(i)), td=tds[i];
        const cor=v==null?"var(--grid)":(td&&td.style&&td.style.color)||"var(--s3)";
        q.push(`<i data-col="${i}" style="background:${cor}"
          title="${esc((ths[i]||"")+": "+cel(i))}"></i>`);
      }
      partes.push(`<div class="heat">${q.join("")}</div>`);
    }
    const sub=[];
    for(let i=0;i<nCols;i++){
      if(pulados.has(i)) continue;
      const v=cel(i); if(!v||v==="—"||v==="·") continue;
      sub.push(`${esc((ths[i]||"").toLowerCase())} <b>${esc(v)}</b>`);
    }
    if(sub.length) partes.push(`<div class="sub">${sub.join(" · ")}</div>`);
    c.innerHTML=partes.join("");
    /* o cartão não sabe o que o clique faz — ele devolve o clique para a
       linha de origem, e quem responde é o mesmo código do computador */
    if(c.classList.contains("clicavel"))
      c.addEventListener("click",ev=>{
        const alvo=ev.target.closest("[data-col]");
        const cel2=alvo?tds[+alvo.dataset.col]:null;
        const dentro=cel2&&cel2.querySelector("[data-cel],[data-mes]");
        (dentro||cel2&&cel2.hasAttribute("data-cel")?cel2:tr).click();
      });
    const lnk=tr.querySelector(".lnk,[data-abrir]");
    if(lnk&&!c.classList.contains("clicavel")){
      c.classList.add("clicavel");
      c.addEventListener("click",()=>lnk.click());
    }
    cx.appendChild(c);
  });
  const rolo=card.querySelector(".scroll");
  if(rolo) rolo.insertAdjacentElement("beforebegin",cx);
  else card.appendChild(cx);
  const bt=document.createElement("button");
  bt.className="vertab"; bt.type="button";
  bt.textContent="Ver tabela completa";
  bt.addEventListener("click",()=>{
    const aberta=card.classList.toggle("abrirtab");
    bt.textContent=aberta?"Ver em cartões":"Ver tabela completa";
  });
  (rolo||card).insertAdjacentElement("afterend",bt);
  card.classList.add("temcartao");
  card.dataset.emCartao="1";
}
/* Roda depois de cada repintura. Idempotente: o marcador emCartao impede
   que uma segunda passada duplique os cartões. */
function cartoesDoPainel(p){
  if(!ehCelular()) return;
  const sec=document.getElementById("p-"+p); if(!sec) return;
  sec.querySelectorAll(".card").forEach(c=>{ if(c.querySelector("table.tb")) emCartoes(c); });
  recolheApoio(sec);
}
/* Os parágrafos de "como ler" são bons e não vão sumir — mas no telefone eles
   empurram o primeiro número para fora da tela. Viram um "Como ler" que abre.
   Fica de fora tudo que tem id: esses textos são reescritos pelo próprio
   relatório e embrulhá-los quebraria a atualização. */
function recolheApoio(sec){
  sec.querySelectorAll(".card > .sub, .hd > .sub").forEach(el=>{
    if(el.id||el.dataset.apoio==="1") return;
    const t=(el.textContent||"").trim();
    if(t.length<150) return;
    el.dataset.apoio="1";
    const d=document.createElement("details");
    d.className="apoio";
    const sm=document.createElement("summary");
    sm.textContent="Como ler";
    el.parentNode.insertBefore(d,el);
    d.appendChild(sm); d.appendChild(el);
  });
}
