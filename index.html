/* =====================================================================
   ASSISTENTE DO RELATÓRIO

   O navegador nunca fala com a Anthropic direto: a chave de API viveria no
   HTML e qualquer pessoa a leria. Quem fala é um Worker no Cloudflare, que
   confere o login do Firebase, confere a permissão em config/acessos e só
   então chama o modelo.

   A resposta chega em streaming (SSE) para o texto aparecer enquanto é
   escrito — 15 segundos de tela parada passam sensação de travamento.
   ===================================================================== */
const CHAT_URL = "https://planik-assistente.jorge-lima.workers.dev";
/* mesma imagem do botão flutuante, reaproveitada nas respostas e no título */
const AVATAR = document.querySelector("#chatBtn .ava").src;

const SUGESTOES = [
  "Qual o maior gargalo da operação hoje?",
  "Quantas vendas tivemos no último trimestre?",
  "Como o VSO é calculado?",
  "Quais empreendimentos estão furando o teto de desconto?",
  "Compare o desempenho de House e Parcerias"
];

let chatHist = [];        /* [{role, content}] — o que vai para o modelo */
let chatOcupado = false;

/* Formatação mínima e segura: escapa tudo primeiro, depois reconstrói só
   negrito, parágrafo e lista. Nada de innerHTML com texto do modelo cru. */
function fmtIA(t){
  const e = esc(t);
  const blocos = e.split(/\n{2,}/).map(b=>{
    const linhas = b.split("\n");
    if(linhas.every(l=>/^\s*[-•*]\s+/.test(l)) && linhas.length){
      return "<ul>"+linhas.map(l=>"<li>"+l.replace(/^\s*[-•*]\s+/,"")+"</li>").join("")+"</ul>";
    }
    return "<p>"+linhas.join("<br>")+"</p>";
  }).join("");
  return blocos.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}

function chatPinta(){
  const log = $("#chatLog"); if(!log) return;
  if(!chatHist.length){
    log.innerHTML = `<div class="chatvazio">
      Faça a sua pergunta sobre vendas, metas, atingimento, VSO, desconto,
      canais, gerentes e origem. As respostas saem da planilha de
      <b>${esc((D.meta&&D.meta.atualizado)||"—")}</b>, no recorte <b>Geral</b> de
      <b>${esc((D.meta&&D.meta.periodo)||"")}</b>.
      <div class="sugs">${SUGESTOES.map(q=>
        `<button class="sug" data-sug="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    </div>`;
    log.querySelectorAll("[data-sug]").forEach(b=>
      b.addEventListener("click",()=>chatEnviar(b.dataset.sug)));
    return;
  }
  log.innerHTML = chatHist.map(m=> m.role==="user"
    ? `<div class="msg eu">${esc(m.content)}</div>`
    : m.erro ? `<div class="msg err">${esc(m.content)}</div>`
      : `<div class="msg ia"><img class="ava" src="${AVATAR}" alt="Jorge">
           <div class="txt">${fmtIA(m.content)}</div></div>`
  ).join("");
  log.scrollTop = log.scrollHeight;
}

async function chatEnviar(texto){
  const t = String(texto||"").trim();
  if(!t || chatOcupado) return;
  const ta = $("#chatIn"); if(ta) ta.value="";
  chatHist.push({role:"user",content:t});
  chatHist.push({role:"assistant",content:""});
  chatOcupado = true; chatBotao();
  chatPinta();
  const iAlvo = chatHist.length-1;
  const t0 = Date.now();
  const pinta = txt => {
    chatHist[iAlvo].content = txt;
    const log=$("#chatLog"); if(!log) return;
    const ult=log.lastElementChild;
    if(ult){ ult.className="msg ia";
      ult.innerHTML=`<img class="ava" src="${AVATAR}" alt="Jorge">`
        +`<div class="txt pisca">${fmtIA(txt)}</div>`;
      log.scrollTop=log.scrollHeight; }
  };

  try{
    if(/^__/.test(CHAT_URL)) throw new Error(
      "O assistente ainda não foi ligado neste endereço. Fale com a Inteligência Comercial.");
    const user = window.PLK_AUTH && window.PLK_AUTH.currentUser;
    if(!user) throw new Error("SESSAO");
    const idToken = await user.getIdToken();
    /* falha de rede vira TypeError com texto em inglês ("Failed to fetch");
       ninguém aqui deve ler isso, então traduzimos para algo acionável */
    let r;
    try{
      r = await fetch(CHAT_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({idToken, mensagens: chatHist.slice(0,-1)})
      });
    }catch(e){
      throw new Error("Não consegui falar com o assistente. Verifique a conexão e tente de novo.");
    }

    const tipo = r.headers.get("content-type")||"";
    if(!r.ok || tipo.includes("application/json")){
      let msg="O assistente está indisponível no momento.";
      try{ const j=await r.json(); if(j&&j.erro) msg=j.erro; }catch(e){}
      throw new Error(msg);
    }

    /* SSE: os pedaços chegam em blocos separados por linha em branco */
    const leitor = r.body.getReader();
    const dec = new TextDecoder();
    let buf="", texto="", parada=null;
    while(true){
      const {done,value} = await leitor.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      const partes = buf.split("\n\n"); buf = partes.pop();
      for(const parte of partes){
        for(const linha of parte.split("\n")){
          if(!linha.startsWith("data:")) continue;
          const cru = linha.slice(5).trim();
          if(!cru || cru==="[DONE]") continue;
          let ev; try{ ev=JSON.parse(cru); }catch(e){ continue; }
          if(ev.type==="content_block_delta" && ev.delta && ev.delta.type==="text_delta"){
            texto += ev.delta.text; pinta(texto);
          }
          if(ev.type==="message_delta" && ev.delta && ev.delta.stop_reason)
            parada=ev.delta.stop_reason;
          if(ev.type==="error"){
            throw new Error((ev.error&&ev.error.message)||"Falha ao gerar a resposta.");
          }
        }
      }
    }
    /* Sem texto e cortado por tamanho: o raciocínio comeu a cota. Dizer isso é
       melhor que "tente de novo", porque tentar de novo daria no mesmo. */
    if(!texto && parada==="max_tokens")
      throw new Error("A pergunta é ampla demais para uma resposta só. "
        +"Quebre em duas ou três perguntas menores — por exemplo, primeiro os gerentes, "
        +"depois os canais e as origens.");
    if(!texto) throw new Error("O assistente não devolveu resposta. Tente perguntar de novo.");
    if(parada==="max_tokens")
      texto += "\n\n*(resposta interrompida por tamanho — peça a continuação ou "
             + "divida a pergunta em partes menores)*";
    chatHist[iAlvo].content = texto;
  }catch(err){
    const m = (err&&err.message)==="SESSAO"
      ? "Sua sessão expirou. Recarregue a página e entre de novo."
      : ((err&&err.message)||"Não foi possível falar com o assistente.");
    chatHist[iAlvo] = {role:"assistant",content:m,erro:true};
  }finally{
    chatOcupado = false; chatBotao(); chatPinta();
    /* a pergunta e a resposta ficam registradas para o admin. Erro também
       entra: uma sequência de falhas é justamente o que a gestão precisa ver. */
    const fim = chatHist[iAlvo]||{};
    if(window.PLK_LOG) window.PLK_LOG({
      tipo:"pergunta", pergunta:t.slice(0,2000),
      resposta:String(fim.content||"").slice(0,20000),
      erro:!!fim.erro, segundos:Math.round((Date.now()-t0)/100)/10,
      turno:Math.ceil(chatHist.length/2)
    });
    const ta2=$("#chatIn"); if(ta2) ta2.focus();
  }
}

function chatBotao(){
  const b=$("#chatEnv"); if(!b) return;
  b.disabled = chatOcupado;
  b.textContent = chatOcupado ? "…" : "Enviar";
}

function abrirChat(){
  if(!podeUsarChat()) return;
  abrir({
    titulo:"Fale com o Jorge",
    icone:AVATAR,
    sub:`Assistente da Inteligência Comercial · responde com os números desta
      plataforma · planilha de <b>${esc((D.meta&&D.meta.atualizado)||"—")}</b>`,
    html:`<div class="chatwrap"><div class="chatlog" id="chatLog"></div></div>`,
    rodape:`<form class="chatform" id="chatForm">
        <textarea id="chatIn" rows="1" placeholder="Escreva sua pergunta…"
          autocomplete="off"></textarea>
        <button type="submit" class="chatenv" id="chatEnv">Enviar</button>
      </form>
      <div class="chataviso">Jorge é o assistente da Inteligência Comercial. Ele lê
        apenas os dados deste relatório — não tem informação de mercado, de clientes
        nem de contratos — e pode errar. Confira os números nas abas antes de decidir.
        As perguntas e as respostas ficam registradas para a Inteligência Comercial.</div>`,
    render(){
      chatPinta(); chatBotao();
      const f=$("#chatForm"), ta=$("#chatIn");
      if(f) f.addEventListener("submit",ev=>{ ev.preventDefault(); chatEnviar(ta.value); });
      if(ta){
        ta.addEventListener("keydown",ev=>{
          if(ev.key==="Enter" && !ev.shiftKey){ ev.preventDefault(); chatEnviar(ta.value); }
        });
        ta.addEventListener("input",()=>{ ta.style.height="auto";
          ta.style.height=Math.min(ta.scrollHeight,130)+"px"; });
        setTimeout(()=>ta.focus(),60);
      }
    }
  });
}
$("#chatBtn").addEventListener("click",abrirChat);
