<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planik · Inteligência Comercial 2026</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ===========================================================================
   PALETA — validada (all-pairs, claro e escuro): #2a78d6 / #B08A2E / #B0397A
   Verde/âmbar/vermelho são RESERVADOS para status; nunca viram cor de série.
   =========================================================================== */
:root{
  --bg:#f4f3f0; --card:#fff; --card-2:#faf9f7;
  --ink:#16171a; --ink-2:#4a4b4f; --muted:#7b7c80;
  --border:#e3e1dc; --grid:#eceae5;
  --s1:#2a78d6; --s2:#B08A2E; --s3:#B0397A; --s4:#5A6B7C; --s0:#8a8a85;
  --good:#1a7a4e; --warn:#B4651A; --bad:#C0392B;
  --good-bg:#e8f3ed; --warn-bg:#fbf0e5; --bad-bg:#fbeceb;
  --gold:#B08A2E; --shadow:0 1px 2px rgba(20,20,20,.05),0 8px 24px rgba(20,20,20,.06);
}
:root[data-theme="dark"]{
  --bg:#0f1012; --card:#17181b; --card-2:#1d1e22;
  --ink:#f3f2ef; --ink-2:#c3c2bd; --muted:#8d8e91;
  --border:#2a2b2f; --grid:#25262a;
  --s1:#4A8FE0; --s2:#B08526; --s3:#BE4A84; --s4:#8FA0B0; --s0:#7e7e79;
  --good:#2f9e6a; --warn:#D07C2A; --bad:#E05C4E;
  --good-bg:#15271f; --warn-bg:#2a1f12; --bad-bg:#2b1817;
  --gold:#C9A24A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom)}
body.locked{overflow:hidden}
body.locked .app{filter:blur(7px); pointer-events:none; user-select:none}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.011em}
button{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.topin{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand .mark{font-size:15px;font-weight:750;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.brand .sep{color:var(--border)}
.brand .ttl{font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11.5px;color:var(--muted);background:var(--card-2);border:1px solid var(--border);
  border-radius:99px;padding:4px 10px;white-space:nowrap}
/* Em tela menor o "Sair" caía sozinho numa segunda linha do cabeçalho. A data
   da planilha é a informação mais dispensável ali — ela continua no rodapé e
   dentro de cada modal. Some ela primeiro; o período, depois. */
@media(max-width:1220px){ #hdUpd{display:none} }
@media(max-width:1080px){ #hdPeriodo{display:none} }
.iconbtn{background:var(--card-2);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;
  cursor:pointer;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.iconbtn:hover{border-color:var(--gold)}
.userbadge{font-size:12px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--border);
  border-radius:99px;padding:5px 11px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.userbadge .role{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--gold);font-weight:700}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--border);
  margin-top:2px;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
.tgl.forma button{padding:5px 11px;font-size:11.5px}
.tab{background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;padding:11px 13px;
  font-size:13.5px;font-weight:550;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:650}
main{padding:20px 0 56px}
.panel{display:none}.panel.on{display:block}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 17px;box-shadow:var(--shadow)}
.card>.hd{margin-bottom:13px}
.card .h{font-size:14.5px;font-weight:650}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.grid{display:grid;gap:13px;min-width:0}
/* item de grid não encolhe sozinho: sem isto, uma tabela larga empurra a página inteira */
.grid>*{min-width:0}
.card{min-width:0}
.scroll{max-width:100%}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g1{grid-template-columns:1fr}
.g21{grid-template-columns:1.5fr 1fr;align-items:start}
.gauto{grid-template-columns:repeat(auto-fit,minmax(198px,1fr))}
.cnc{padding:13px 14px}
.cnc .val{font-size:clamp(15px,1.45vw,19px)!important}
.cnc .sub{font-size:11px!important}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.g3,.g2,.g21{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}}

.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.kpi .val{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:6px 0 3px;line-height:1.15;
  word-break:break-word}
.kpi .val.lg{font-size:31px}
.kpi .val.sm{font-size:20px}
.kpi .sub{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.meter{height:5px;background:var(--grid);border-radius:99px;overflow:hidden;margin-top:10px}
.meter span{display:block;height:100%;border-radius:99px}
.track{position:relative;height:9px;background:var(--grid);border-radius:99px}
.barfill{height:100%;border-radius:99px}
.metamark{position:absolute;top:-3px;width:2px;height:15px;background:var(--muted);opacity:.75}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;
  border-radius:99px;white-space:nowrap}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.w{background:var(--warn-bg);color:var(--warn)}
.pill.b{background:var(--bad-bg);color:var(--bad)}
.pill.off{background:var(--card-2);color:var(--muted);border:1px solid var(--border)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}

.tgl{display:inline-flex;background:var(--card-2);border:1px solid var(--border);border-radius:8px;
  padding:2px;gap:2px;flex-wrap:wrap}
.tgl button{background:none;border:0;border-radius:6px;cursor:pointer;padding:6px 11px;font-size:12.5px;
  font-weight:550;color:var(--muted)}
.tgl button.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Recorte de ato. Quando "Ato pago" está ligado o relatório inteiro muda de
   número, então o estado precisa ser impossível de não notar: botão em dourado
   e uma faixa no rodapé do cabeçalho. Relatório filtrado que parece relatório
   normal é como alguém leva número errado para a diretoria. */
.atotgl button.on[data-a="pago"]{background:var(--gold);color:#fff}
:root[data-theme="dark"] .atotgl button.on[data-a="pago"]{color:#14100a}
:root[data-ato="pago"] header.top{box-shadow:inset 0 -3px 0 var(--gold)}
.atochip{display:none;font-size:11.5px;color:var(--gold);font-weight:650}

/* selo da tela de conferência: símbolo grande, cor de status, sem depender
   só da cor — o ✓ e o ✕ já se distinguem por forma para quem não vê cor */
.selo{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:50%;font-size:15px;font-weight:800;line-height:1}
.selo.ok{background:var(--good-bg);color:var(--good)}
.selo.erro{background:var(--bad-bg);color:var(--bad)}
.selo.aviso{background:var(--warn-bg);color:var(--warn)}
:root[data-ato="pago"] .atochip{display:inline}

.periodo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.periodo input[type=date]{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--border);
  border-radius:7px;background:var(--card);color:var(--ink);color-scheme:light}
:root[data-theme="dark"] .periodo input[type=date]{color-scheme:dark}
.periodo .lbl{color:var(--muted)}
.preset{background:var(--card-2);border:1px solid var(--border);border-radius:99px;padding:4px 10px;
  font-size:11.5px;cursor:pointer;color:var(--ink-2)}
.preset:hover,.preset.on{border-color:var(--gold);color:var(--ink)}

.tb{font-size:13px}
.tb th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card)}
.tb td{padding:9px 10px;border-bottom:1px solid var(--grid)}
.tb td.r{white-space:nowrap}
.tb tbody tr:last-child td{border-bottom:0}
.tb tbody tr.clickable{cursor:pointer}
.tb tbody tr.clickable:hover{background:var(--card-2)}
.tb .r{text-align:right}.tb .c{text-align:center}.tb .nm{font-weight:600}
.tb tr.tot td{font-weight:700;border-top:1.5px solid var(--border);background:var(--card-2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stickyc{position:sticky;left:0;background:var(--card);z-index:1;white-space:nowrap}
.tb tr.tot .stickyc{background:var(--card-2)}
.lnk{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;
  text-decoration-color:var(--muted)}
.lnk:hover{color:var(--gold);text-decoration-color:var(--gold)}
.spark{cursor:pointer;border-radius:5px;padding:2px}
.spark:hover{background:var(--card-2);outline:1px solid var(--border)}

svg{display:block;width:100%;height:auto;overflow:hidden}
.gridline{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--border);stroke-width:1}
.axislab{fill:var(--muted);font-size:10px;font-family:inherit}
.dlab{fill:var(--ink-2);font-size:10px;font-weight:650;font-family:inherit;font-variant-numeric:tabular-nums}
/* halo: o rótulo desvia de outros rótulos, mas a linha do gráfico ainda pode
   passar atrás dele. O contorno na cor do fundo mantém o número legível. */
.dlab.halo{paint-order:stroke;stroke:var(--card);stroke-width:3.2px;stroke-linejoin:round}
.hit{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px;font-size:12.5px}
.legend .it{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.legend .it b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend .it.clickable{cursor:pointer}

#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;z-index:300;background:var(--card);
  color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12px;
  box-shadow:var(--shadow);max-width:280px}

.ov{position:fixed;inset:0;background:rgba(12,12,14,.55);backdrop-filter:blur(3px);display:none;
  align-items:flex-start;justify-content:center;z-index:120;padding:22px 10px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:13px;
  box-shadow:0 24px 64px rgba(0,0,0,.28);width:100%;max-width:1140px;overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:15px 17px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--card);z-index:3}
.modal .mh .t{font-size:16px;font-weight:680;letter-spacing:-.015em}
.modal .mh .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.modal .mb{padding:0;max-height:min(70vh,720px);overflow:auto}
.modal .mf{padding:10px 17px;border-top:1px solid var(--border);background:var(--card-2);font-size:12px;
  color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
/* o display:block anulava o atributo hidden e sobrava um quadrado de 46px em
   todo modal sem avatar — o [hidden] tem de vencer, e por isso vem depois */
.ovava{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:block;margin-top:1px}
.ovava[hidden]{display:none}
@media(max-width:640px){ .ovava{width:40px;height:40px} }
.x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 3px}
.crumb{background:none;border:0;padding:0;cursor:pointer;color:var(--gold);font-size:12.5px;font-weight:600}
.crumb:hover{text-decoration:underline}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13px}

/* ---- filtro estilo Excel ---- */
.fh{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.fh .car{opacity:.4;font-size:9px;transition:opacity .1s}
.fh:hover .car{opacity:.9}
.fh.act .car{opacity:1;color:var(--gold)}
.fh.act{color:var(--gold)}
.fmenu{position:fixed;z-index:400;background:var(--card);border:1px solid var(--border);border-radius:9px;
  box-shadow:0 16px 44px rgba(0,0,0,.24);width:266px;padding:6px;display:none;font-size:12.5px}
.fmenu.on{display:block}
.fmenu .op{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 9px;border-radius:6px;
  cursor:pointer;font-size:12.5px}
.fmenu .op:hover{background:var(--card-2)}
.fmenu hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.fmenu input.srch{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;
  background:var(--card-2);color:var(--ink);font:inherit;font-size:12.5px;margin:2px 0 6px}
.fvals{max-height:190px;overflow:auto;padding:0 2px}
.fvals label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fvals label:hover{background:var(--card-2)}
.fvals input{accent-color:var(--gold);flex:0 0 auto}
.fbtns{display:flex;gap:7px;margin-top:7px}
.fbtns button{flex:1;padding:8px;border-radius:7px;border:1px solid var(--border);cursor:pointer;
  font-size:12.5px;font-weight:600;background:var(--card-2)}
.fbtns .ok{background:var(--gold);border-color:var(--gold);color:#14161a}

#loginOverlay{position:fixed;inset:0;z-index:500;padding:20px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#2b2e33 0%,#1c1e22 45%,#141518 100%)}
.login{background:#fff;border-radius:16px;box-shadow:0 26px 70px rgba(0,0,0,.45);padding:0 30px 30px;
  width:100%;max-width:392px;overflow:hidden;position:relative;color:#16171a}
.login:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;
  background:linear-gradient(90deg,#8d6d1c,#d9b45c,#8d6d1c)}
.login .mark{font-size:34px;font-weight:300;letter-spacing:.34em;text-align:center;color:#16171a;
  padding:34px 0 0;text-indent:.34em;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.login .t1{text-align:center;font-size:16px;font-weight:700;margin-top:14px;color:#16171a}
.login .sb{text-align:center;color:#7b7c80;font-size:12.5px;margin:5px 0 24px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:650;color:#3c3d41;margin-bottom:6px}
.fld input{width:100%;padding:12px 13px;border:1px solid #dcdad4;border-radius:9px;background:#faf9f7;
  color:#16171a;font:inherit;font-size:16px}
.fld input::placeholder{color:#a9a8a3}
.fld input:focus{outline:2px solid #B08A2E;outline-offset:-1px;background:#fff}
.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#B08A2E;color:#fff;font-weight:700;
  font-size:15px;cursor:pointer;margin-top:10px;letter-spacing:.01em}
.btn:hover{background:#9c7826}
.btn:disabled{opacity:.6;cursor:default}
.err{color:#C0392B;font-size:12.5px;min-height:18px;margin-top:9px;text-align:center}
/* olho de revelar a senha: fica dentro do campo, e o padding a direita do
   input abre espaco para ele nao cobrir o que a pessoa digita */
.senha{position:relative}
.senha input{padding-right:46px}
/* O Edge desenha um olho proprio dentro do campo. Desligado aqui para nao
   ficarem dois — o nosso e igual em todo navegador, o nativo so existe em alguns. */
.senha input::-ms-reveal,
.senha input::-ms-clear{display:none;width:0;height:0}
.olho{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;
  cursor:pointer;padding:0;opacity:.6;color:#3c3d41}
.olho svg{width:21px;height:21px;display:block}
.olho:hover{opacity:1;background:#efece4}
.olho:focus-visible{outline:2px solid #B08A2E;outline-offset:-1px;opacity:1}
.olho[aria-pressed="true"]{opacity:1;color:#B08A2E}
.txtbtn{background:var(--card-2);border:1px solid var(--border);border-radius:8px;padding:7px 13px;
  cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.txtbtn:hover{border-color:var(--gold);color:var(--ink)}
/* números grandes continuam legíveis: a fonte encolhe sozinha */
.kpi .val{font-size:clamp(17px,2.05vw,25px)}
.kpi .val.lg{font-size:clamp(20px,2.6vw,31px)}
.kpi .val.sm{font-size:clamp(15px,1.65vw,20px)}
/* engrenagem / cadastro */
.cfgrow{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.cfgrow.off{opacity:.55}
.cfgrow .nm{font-weight:650;min-width:120px}
.sw{width:42px;height:23px;border-radius:99px;border:1px solid var(--border);background:var(--grid);
  position:relative;cursor:pointer;flex:0 0 auto;transition:background .12s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .12s}
.sw.on{background:var(--good);border-color:var(--good)}
.sw.on:after{left:21px}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.swlab{font-size:11.5px;color:var(--muted);width:52px;flex:0 0 auto}
.badge-novo{font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--warn-bg);color:var(--warn);
  padding:2px 6px;border-radius:99px;margin-left:7px;text-transform:uppercase}
.selin,.txtin{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;
  background:var(--card);color:var(--ink)}
.grouphd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
  margin:18px 0 4px}
.cfgnote{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
/* ---------- Assistente ---------- */
/* Fora do cabeçalho o avatar pode ter o tamanho de um rosto. Flutuando no canto
   inferior direito ele fica visível em qualquer rolagem, não disputa espaço com
   os outros controles e é o lugar onde as pessoas já procuram um assistente. */
.fab{position:fixed;right:22px;bottom:22px;z-index:110;
  display:flex;align-items:center;gap:11px;
  background:var(--card);border:1px solid var(--border);border-radius:999px;
  padding:6px 20px 6px 6px;cursor:pointer;
  box-shadow:0 4px 12px rgba(20,20,20,.10),0 14px 34px rgba(20,20,20,.16);
  transition:transform .14s ease,box-shadow .14s ease}
.fab:hover{transform:translateY(-2px);border-color:var(--gold);
  box-shadow:0 6px 16px rgba(20,20,20,.13),0 18px 44px rgba(20,20,20,.20)}
.fab .ava{width:52px;height:52px;border-radius:50%;display:block;flex:0 0 auto}
.fab .pt{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
/* no celular só o rosto: o texto roubaria metade da largura da tela */
@media(max-width:640px){
  .fab{right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:4px;gap:0}
  .fab .pt{display:none}
  .fab .ava{width:46px;height:46px}
  footer{padding-bottom:86px}
}

/* =====================================================================
   CELULAR

   Três decisões, e elas explicam quase todo o CSS abaixo.

   1. A navegação desce. No computador a fita de abas fica no topo; no
      telefone ela vira uma barra fixa embaixo, no alcance do polegar, com as
      quatro telas mais usadas e um "Mais" para o resto. O topo cai de três
      linhas para uma.
   2. A tabela vira cartão. Nenhuma coluna some — elas se reorganizam dentro
      de um cartão por linha. Quem quiser a tabela original tem um botão
      "Ver tabela" em cada bloco, e nela a primeira coluna fica presa.
   3. O computador não muda. Tudo aqui vive dentro de @media, e a marcação
      extra fica escondida acima de 760px.
   ===================================================================== */
.navmob{display:none}
.cartoes{display:none}
.vertab{display:none}
.iconbtn.mais{display:none!important}

@media(max-width:760px){
  /* --- topo enxuto ------------------------------------------------- */
  body.entrou header.top{position:sticky;top:0;z-index:90}
  .topin{gap:8px;padding:9px 0;flex-wrap:nowrap;align-items:center}
  .brand .ttl,.brand .sep{display:none}
  #hdPeriodo,#hdUpd,#userBadge,#tgl,#cfgBtn,#logoutBtn{display:none!important}
  .atotgl{margin-left:auto}
  .topin .iconbtn.mais{display:grid!important;flex:0 0 auto}
  header.top .tabs{display:none}          /* a fita de abas foi para baixo */

  /* --- barra inferior ----------------------------------------------- */
  .navmob{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:120;
    background:var(--card);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 14px rgba(20,20,20,.06)}
  .navmob button{flex:1;background:none;border:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:600;color:var(--muted);padding:5px 2px;
    min-height:44px;border-radius:9px}
  .navmob button .ic{font-size:16px;line-height:1}
  .navmob button.on{color:var(--gold)}
  main.wrap{padding-bottom:78px}
  footer{padding-bottom:26px}
  .fab{bottom:calc(env(safe-area-inset-bottom) + 74px)}

  /* --- folha do "Mais" ---------------------------------------------- */
  .folha{position:fixed;inset:0;z-index:200;display:none}
  .folha.on{display:block}
  .folha .fundo{position:absolute;inset:0;background:rgba(20,20,20,.42)}
  .folha .corpo{position:absolute;left:0;right:0;bottom:0;background:var(--card);
    border-radius:18px 18px 0 0;padding:10px 14px calc(16px + env(safe-area-inset-bottom));
    max-height:82vh;overflow:auto;box-shadow:0 -10px 40px rgba(20,20,20,.22)}
  .folha .puxador{width:40px;height:4px;border-radius:2px;background:var(--border);
    margin:2px auto 12px}
  .folha .grupo{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);font-weight:650;margin:14px 2px 7px}
  .folha .item{display:flex;align-items:center;gap:11px;width:100%;background:none;
    border:0;border-radius:11px;padding:12px 10px;font-size:14px;color:var(--ink);
    cursor:pointer;text-align:left;min-height:46px}
  .folha .item:active{background:var(--card-2)}
  .folha .item.on{background:var(--card-2);color:var(--gold);font-weight:650}
  .folha .item .ic{width:22px;text-align:center;font-size:15px;flex:0 0 auto}

  /* --- cartões no lugar da tabela ----------------------------------- */
  .temcartao .scroll{display:none}
  .temcartao.abrirtab .scroll{display:block}
  .temcartao.abrirtab .cartoes{display:none}
  .cartoes{display:grid;gap:9px;margin-top:2px}
  .vertab{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);
    border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;
    color:var(--ink-2);cursor:pointer;margin-top:11px;min-height:38px}
  .cartoes{min-width:0}
  .cart{border:1px solid var(--border);border-radius:11px;padding:11px 12px;
    background:var(--card);display:grid;gap:7px;min-width:0;overflow:hidden}
  .cart.clicavel{cursor:pointer}
  .cart.clicavel:active{background:var(--card-2)}
  .cart .l1{display:flex;align-items:baseline;gap:9px;min-width:0}
  .cart .nome{font-weight:650;font-size:13.5px;min-width:0;flex:1 1 auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cart .val{margin-left:auto;flex:0 1 auto;font-variant-numeric:tabular-nums;
    font-weight:700;font-size:13.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .cart .sub{overflow-wrap:anywhere}
  .cart .sub{font-size:11.5px;color:var(--muted);line-height:1.5}
  .cart .sub b{color:var(--ink-2);font-weight:600}
  .cart .track{height:7px}
  .cart .mini{display:flex;gap:3px;align-items:flex-end;height:30px}
  .cart .mini i{flex:1;border-radius:2px 2px 0 0;min-height:2px;display:block}
  .cart .minirot{display:flex;gap:3px;margin-top:-3px}
  .cart .minirot span{flex:1;text-align:center;font-size:8.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.02em}
  .cart .heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
  .cart .heat i{height:20px;border-radius:3px;display:block;font-style:normal;
    font-size:8px;line-height:20px;text-align:center;color:#fff}

  /* --- conforto de toque -------------------------------------------- */
  .txtbtn,.preset,.tgl button,.sug{min-height:38px}
  .periodo{gap:7px}
  .periodo input[type=date]{min-height:38px}
  .grid.g4,.grid.g3,.grid.g2{grid-template-columns:repeat(2,1fr)}
  .grid.g1{grid-template-columns:1fr}
  .card{padding:12px}
  .hd .sub{font-size:11.5px}
  /* textos de apoio longos viram "detalhes" */
  details.apoio{margin-top:9px}
  details.apoio>summary{font-size:11.5px;color:var(--gold);cursor:pointer;
    list-style:none;padding:6px 0}
  details.apoio>summary::-webkit-details-marker{display:none}
}
@media(max-width:360px){
  .grid.g4,.grid.g3,.grid.g2{grid-template-columns:1fr}
  .navmob button{font-size:9.5px}
}

  window.PLK_LOG=function(dados){
    try{
      if(!window.PLK_DB) return;
      var u=window.currentUser||{};
      var d=new Date(), p=function(x){return (x<10?"0":"")+x;};
      var dia=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
      window.PLK_DB.collection("log").add(Object.assign({
        ts:Date.now(), dia:dia, mes:dia.slice(0,7),
        user:u.user||"?", nome:u.nome||u.user||"?"
      },dados||{})).catch(function(){});
    }catch(e){}
  };
  var LABEL={admin:"Admin",diretor_online:"Diretor House",diretor_parcerias:"Diretor Parcerias",
             gerente:"Gerente",leitor:"Leitor"};
  function roleFor(u){ var r=window.PLK_ROLES[u];
    return r?Object.assign({user:u},r):{user:u,role:"leitor",nome:u}; }
  /* Junta a lista do arquivo com a do banco antes de decidir a entrada.
     Sem esse await a gente barraria justamente quem foi liberado pela
     engrenagem, já que a lista do banco chega depois do login. */
  function liberar(u,ok,nao){
    if(!window.PLK_DB) return window.PLK_ROLES[u]?ok():nao();
    window.PLK_DB.collection("config").doc("acessos").get().then(function(sn){
      try{
        var d=(sn.exists?sn.data():{})||{};
        var extra=d.lista?JSON.parse(d.lista):{};
        Object.keys(extra).forEach(function(k){
          window.PLK_ROLES[k]=Object.assign({role:"leitor"},window.PLK_ROLES[k]||{},extra[k]);
        });
        if(window.PLK_ROLES.admin) window.PLK_ROLES.admin.cfg="edita";
      }catch(e){}
      window.PLK_ROLES[u]?ok():nao();
    }).catch(function(){ window.PLK_ROLES[u]?ok():nao(); });
  }
  function barrar(u){
    try{ if(auth) auth.signOut(); }catch(e){}
    window.currentUser=null; document.body.classList.add("locked");
    var o=$("loginOverlay"); if(o) o.style.display="";
    var e=$("li_err");
    if(e) e.textContent="Acesso não liberado para "+u+"@planik.app. Fale com a Inteligência Comercial.";
    var pw=$("li_pass"); if(pw) pw.value="";
  }
  function entrar(u){ liberar(u,function(){enter(u);},function(){barrar(u);}); }
  function enter(u){
    var f=roleFor(u); window.currentUser=f;
    var b=$("userBadge");
    if(b) b.innerHTML="👤 "+f.nome+'<span class="role">'+(LABEL[f.role]||"Leitor")+"</span>";
    document.body.classList.remove("locked");
    var o=$("loginOverlay"); if(o) o.style.display="none";
    /* uma linha por abertura da plataforma, não por recarga de aba: o
       onAuthStateChanged dispara de novo a cada F5 e o log viraria ruído */
    try{
      if(!sessionStorage.getItem("plk_acesso")){
        sessionStorage.setItem("plk_acesso","1");
        window.PLK_LOG({tipo:"acesso"});
      }
    }catch(e){ window.PLK_LOG({tipo:"acesso"}); }
    load();
  }
  function status(m,s){ var a=$("dataStatus"),b=$("dataStatusMsg");
    if(b)b.textContent=m||""; if(a)a.style.display=s?"flex":"none"; }
  function load(){
    if(window.__BOOTED__){ try{window.initDashboard();}catch(e){} return; }
    status("Carregando dados…",true);
    if(!window.PLK_DB){ status("Sem conexão com o banco. Verifique a internet e recarregue.",true); return; }
    /* Quem tem visão restrita pede OUTRO documento — o que já vem sem o valor
       e o desconto das unidades dos outros canais. Não é a tela que filtra:
       é o banco que entrega menos. A regra do Firestore fecha a porta do
       documento completo para esses logins; isto aqui só evita bater nela. */
    var qual=((window.currentUser||{}).visao==="parcerias")?"parcerias":"atual";
    window.PLK_DB.collection("dados").doc(qual).get().then(function(s){
      if(!s.exists){ status(qual==="parcerias"
        ? "A visão restrita ainda não foi publicada. Avise a Inteligência Comercial."
        : "Dados ainda não publicados. Avise a Inteligência Comercial.",true); return; }
      var d=s.data()||{};
      window.__PLK_DATA__ = d.payloadStr ? JSON.parse(d.payloadStr) : (d.payload||d);
      status("",false);
      if(typeof window.__BOOT__==="function") window.__BOOT__();
    }).catch(function(e){ status("Falha ao carregar os dados. Tente recarregar a página.",true); console.log(e); });
  }
  function busy(b,m){ var x=$("li_btn"); if(x){x.disabled=b;x.textContent=b?"Entrando…":"Entrar";}
    var e=$("li_err"); if(e&&m!=null) e.textContent=m; }
  window.doLogin=function(){
    var u=(($("li_user")||{}).value||"").trim().toLowerCase().replace(/@.*$/,"");
    var p=(($("li_pass")||{}).value||""); var e=$("li_err");
    if(!u||!p){ if(e)e.textContent="Preencha usuário e senha."; return false; }
    if(!fbReady||!auth){ if(e)e.textContent="Sem conexão com o servidor."; return false; }
    busy(true,"");
    auth.signInWithEmailAndPassword(u+DOMAIN,p).then(function(){busy(false,"");})
      .catch(function(err){ busy(false,"");
        /* Nunca mais colapsar tudo em "senha inválida". Em 12/08 o login falhou
           por dominio nao autorizado no Firebase e a tela dizia senha errada —
           gastamos meia hora trocando senha de uma conta que estava correta.
           Erro que a pessoa nao pode resolver sozinha mostra o codigo tecnico. */
        var cod=(err&&err.code)||"desconhecido";
        var M={
          "auth/invalid-credential":  "Usuário ou senha inválidos.",
          "auth/wrong-password":      "Usuário ou senha inválidos.",
          "auth/user-not-found":      "Usuário ou senha inválidos.",
          "auth/invalid-email":       "Usuário inválido.",
          "auth/user-disabled":       "Esta conta está desativada. Fale com a Inteligência Comercial.",
          "auth/too-many-requests":   "Muitas tentativas. Aguarde um instante e tente de novo.",
          "auth/network-request-failed":"Falha de rede. Verifique a internet.",
          "auth/unauthorized-domain": "Este endereço não está autorizado no Firebase. Avise a Inteligência Comercial.",
          "auth/operation-not-allowed":"Login por e-mail e senha está desligado no Firebase.",
          "auth/api-key-not-valid":   "Chave do Firebase inválida para este endereço."
        };
        var m=M[cod];
        if(!m) m="Não foi possível entrar. Código do erro: "+cod+" — mande este código para a Inteligência Comercial.";
        if(e) e.textContent=m;
        try{ console.error("[login] falhou:",cod,err&&err.message); }catch(_){} });
    return false;
  };
  window.doLogout=function(){
    try{ if(auth) auth.signOut(); }catch(e){}
    window.currentUser=null; document.body.classList.add("locked");
    var o=$("loginOverlay"); if(o)o.style.display="";
    var u=$("li_user"),p=$("li_pass"); if(u)u.value=""; if(p)p.value="";
  };
  if(fbReady&&auth) auth.onAuthStateChanged(function(user){
    if(user) entrar((user.email||"").split("@")[0].toLowerCase());
    else{ window.currentUser=null; document.body.classList.add("locked");
          var o=$("loginOverlay"); if(o)o.style.display=""; }
  });
  function wire(){
    var b=$("li_btn"); if(b){b.addEventListener("click",window.doLogin);
      b.addEventListener("touchend",function(e){e.preventDefault();window.doLogin();});}
    var p=$("li_pass"); if(p)p.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();window.doLogin();}});
    var u=$("li_user"); if(u)u.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();var q=$("li_pass");if(q)q.focus();}});
    var l=$("logoutBtn"); if(l)l.addEventListener("click",window.doLogout);
    /* Olho da senha. O foco volta para o campo e o cursor para o fim, senao a
       pessoa clica no olho e perde o lugar onde estava digitando. */
    var o=$("li_olho");
    var SVG_ABERTO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
      +' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +'<path d="M1.8 12S5.4 5.4 12 5.4 22.2 12 22.2 12 18.6 18.6 12 18.6 1.8 12 1.8 12Z"/>'
      +'<circle cx="12" cy="12" r="3.1"/></svg>';
    var SVG_CORTADO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
      +' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +'<path d="M9.8 5.7A9.8 9.8 0 0 1 12 5.4c6.6 0 10.2 6.6 10.2 6.6a19 19 0 0 1-2.8 3.7"/>'
      +'<path d="M6.4 7.8A18.6 18.6 0 0 0 1.8 12S5.4 18.6 12 18.6c1.6 0 3-.3 4.2-.9"/>'
      +'<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';
    if(o){
      o.innerHTML=SVG_ABERTO;
      o.addEventListener("click",function(){
        var c=$("li_pass"); if(!c) return;
        var ver=c.type==="password";
        c.type=ver?"text":"password";
        o.setAttribute("aria-pressed",ver?"true":"false");
        o.setAttribute("aria-label",ver?"Ocultar senha":"Mostrar senha");
        o.title=ver?"Ocultar senha":"Mostrar senha";
        o.innerHTML=ver?SVG_CORTADO:SVG_ABERTO;
        c.focus();
        try{ var n=c.value.length; c.setSelectionRange(n,n); }catch(_){}
      });
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wire); else wire();
})();
</script>

<script>
window.__BOOT__ = function(){
if(window.__BOOTED__){ try{window.initDashboard();}catch(e){} return; }
window.__BOOTED__ = true;

const D=window.__PLK_DATA__;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const MES =["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MESL=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const ANO=(D.meta&&D.meta.anoBase)||2026;
const MESREF=(D.meta&&D.meta.mesRef)||12;

/* ---- Empreendimentos ------------------------------------------------------
   A ordem oficial é uma PREFERÊNCIA, não uma lista fechada: a relação de
   produtos é montada a partir dos dados. Se a planilha ganhar um empreendimento
   novo, ele aparece automaticamente no fim, sem quebrar nada. ------------- */
const ORDEM_PREF=["NIK Frei Caneca","Core Klabin","Linn Vila Mariana","NIK Vila Mariana","Nuv Moema",
  "Taj Ibirapuera","NIK Faria Lima","NIK Estilo Paulista","NIK Sunset Paulista","NIK Paradiso","NIK Paulista"];
const kk=s=>String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .toUpperCase().replace(/[\s.\-_·]/g,"");
const ORD_IDX={}; ORDEM_PREF.forEach((p,i)=>ORD_IDX[kk(p)]=i);
function ordProd(a,b){
  const ia=ORD_IDX[kk(a)], ib=ORD_IDX[kk(b)];
  if(ia!=null&&ib!=null) return ia-ib;
  if(ia!=null) return -1;
  if(ib!=null) return 1;
  return String(a).localeCompare(String(b),"pt");
}
const porOrdem=arr=>arr.slice().sort((a,b)=>ordProd(a.produto||a.nome||a,b.produto||b.nome||b));

/* ---- formatação: sempre número completo, separador brasileiro ---- */
const nf=(v,d=0)=>(v==null||isNaN(v))?"—":Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const moeda =v=>(v==null||isNaN(v))?"—":"R$ "+nf(Math.round(v));
const moedaC=v=>(v==null||isNaN(v))?"—":"R$ "+nf(v,2);
const pct =v=>(v==null||isNaN(v))?"—":nf(v*100,0)+"%";
const pct1=v=>(v==null||isNaN(v))?"—":nf(v*100,1)+"%";
const dtBR=s=>{if(!s)return "—";const p=String(s).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s;};
/* dias entre duas datas ISO (aaaa-mm-dd), sem fuso no meio do caminho */
const diasEntre=(a,b)=>{ if(!a||!b) return null;
  return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000); };
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const stCol=a=>a==null?"var(--muted)":a>=1?"var(--good)":a>=.8?"var(--warn)":"var(--bad)";
function stPill(a){ if(a==null) return '<span class="pill off">sem meta</span>';
  const c=a>=1?"g":a>=.8?"w":"b", t=a>=1?"No alvo":a>=.8?"Atenção":"Abaixo";
  return `<span class="pill ${c}">${t} · ${pct(a)}</span>`; }

/* ---- canais: cor fixa por identidade, com reserva para canais novos ---- */
const HOUSE=["Salão","Online"];
const CANAL_VAR={"Salão":"--s2","Online":"--s3","Parcerias":"--s1","Lançadora":"--s4","Interna":"--s0"};
const RESERVA=["--s1","--s2","--s3","--s4"];
function cCor(c){
  if(CANAL_VAR[c]) return `var(${CANAL_VAR[c]})`;
  const i=(typeof CANAIS!=="undefined"?CANAIS.indexOf(c):-1);
  return `var(${i>=0?RESERVA[i%RESERVA.length]:"--s0"})`;
}

/* ---- tooltip ---- */
const tip=$("#tip");
function showTip(e,h){ tip.innerHTML=h; tip.style.opacity=1;
  const w=tip.offsetWidth||230,ht=tip.offsetHeight||60;
  tip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-w-10))+"px";
  tip.style.top =Math.max(8,Math.min(e.clientY-10,innerHeight-ht-10))+"px"; }
const hideTip=()=>{tip.style.opacity=0;};
function bindTips(root){ (root||document).querySelectorAll("[data-tip]").forEach(el=>{
  el.addEventListener("mousemove",e=>showTip(e,el.dataset.tip));
  el.addEventListener("mouseleave",hideTip); }); }

/* =====================================================================
   TRANSAÇÕES E PERÍODO
   ===================================================================== */
const TX=(D.transacoes||[]).map(t=>Object.assign({},t));
const soma=a=>a.reduce((s,t)=>s+(t.valor||0),0);

/* ---------------------------------------------------------------------
   REGRAS DE OURO — contagem de unidades vendidas
   A coluna Peso da Base já resolve as duas exceções, e é por isso que
   contar linhas está errado em qualquer lugar do relatório:

   · vaga de garagem (unidade começa com "V") tem peso 0 — entra no VGV,
     não entra na contagem de unidades;
   · venda Fifith é dividida entre duas equipes e grava DUAS linhas com
     peso 0,5 cada — vale meia venda para cada gerente/canal e uma venda
     inteira no total, nunca duas.

   Hoje: 381 linhas na Base, 359 unidades. A própria planilha publica 359
   em "Por Canal RESUMIDO", com Parcerias em 185,5 — fracionário porque
   ela também conta Fifith como meia venda. Somar peso é o que concilia.

   Média de metragem / valor do m² NÃO usa isto: lá as duas linhas Fifith
   viram uma venda só (valor somado, metragem contada uma vez) — é o que
   m2DoRecorte() e m2Por() fazem.
   --------------------------------------------------------------------- */
const unid=a=>a.reduce((s,t)=>s+(t.peso||0),0);
/* 0,5 tem que aparecer como 0,5; 12 não pode virar 12,0 */
const nfu=v=>nf(v,Math.abs(v%1)>1e-9?1:0);

/* Universo de empreendimentos: união de tudo que existe nos dados. */
const PRODUTOS=(function(){
  const s=new Set();
  ((D.metas&&D.metas.geral&&D.metas.geral.produtos)||[]).forEach(p=>s.add(p.produto));
  (D.sintese||[]).forEach(x=>s.add(x.produto));
  Object.values((D.desemp||{})).forEach(b=>(b||[]).forEach(x=>s.add(x.produto)));
  TX.forEach(t=>{ if(t.produto) s.add(t.produto); });
  return Array.from(s).filter(Boolean).sort(ordProd);
})();
/* Universo de canais: metadados da planilha + qualquer canal que apareça nas vendas. */
const CANAIS=(function(){
  const s=[]; const add=c=>{ if(c&&c!=="Interna"&&!s.some(x=>kk(x)===kk(c))) s.push(c); };
  ((D.meta&&D.meta.canais)||[]).forEach(add);
  Object.keys((D.metas&&D.metas.canais)||{}).forEach(add);
  TX.forEach(t=>add(t.canal));
  return s;
})();
const TEM_INTERNA=TX.some(t=>t.canal==="Interna");
/* =====================================================================
   CADASTRO DO TIME (engrenagem)
   A semente vem da planilha: quem está no bloco PARÂMETROS entra ativo, e
   qualquer gerente que apareça nas vendas entra como inativo. Assim, gerente
   novo na planilha aparece sozinho no cadastro — nada precisa ser codificado.
   ===================================================================== */
const PARAM=(D.gerentes&&D.gerentes.parametros)||{};
const TIMES=[{id:"House",rot:"Planik Vendas (Salão + Online)"},
             {id:"Parcerias",rot:"Parcerias"},{id:"Lançadora",rot:"Lançadora"}];
const CFG_KEY="planik_time_v1";
function timeDoBloco(b){ const k=kk(b||"");
  if(k==="PLK"||k==="HOUSE"||k.indexOf("PLANIK")===0) return "House";
  if(k==="PARCERIAS") return "Parcerias";
  if(k==="LANCADORA"||k==="LANCADORAS") return "Lançadora";
  return ""; }
function sementeTime(){
  const out={};
  Object.keys(PARAM).forEach(n=>{ out[n]={ativo:true,time:timeDoBloco(PARAM[n].bloco),novo:false,
    mesEntrada:PARAM[n].mesEntrada||1}; });
  TX.forEach(t=>{ const g=t.gerente;
    if(!g||kk(g)==="INTERNA") return;
    if(!Object.keys(out).some(k=>kk(k)===kk(g))) out[g]={ativo:false,time:"",novo:false};
  });
  return out;
}
function mesclarTime(salvo){
  const base=sementeTime();
  Object.keys(salvo||{}).forEach(n=>{
    const achado=Object.keys(base).find(k=>kk(k)===kk(n));
    if(achado) base[achado]=Object.assign({},base[achado],salvo[n]);
    else base[n]=Object.assign({ativo:true,time:"",novo:true},salvo[n]);
  });
  return base;
}
let TIME=(function(){ try{ const raw=localStorage.getItem(CFG_KEY);
  if(raw) return mesclarTime(JSON.parse(raw)); }catch(e){} return sementeTime(); })();
let SYNC="Salvo neste navegador.";
function salvarTime(){
  try{ localStorage.setItem(CFG_KEY,JSON.stringify(TIME)); }catch(e){}
  const u=window.currentUser;
  if(window.PLK_DB && u && u.role==="admin"){
    window.PLK_DB.collection("config").doc("time")
      .set({gerentes:JSON.stringify(TIME),por:u.user||u.nome,ts:Date.now()})
      .then(()=>{ SYNC="Salvo e compartilhado com todos os acessos."; pintaCfg(); })
      .catch(()=>{ SYNC="Salvo neste navegador. O banco recusou a escrita — confira as regras do Firestore."; pintaCfg(); });
  }
}
function carregarTimeDoBanco(){
  if(!window.PLK_DB) return;
  window.PLK_DB.collection("config").doc("time").get().then(sn=>{
    if(!sn.exists) return;
    const d=sn.data()||{}; if(!d.gerentes) return;
    TIME=mesclarTime(JSON.parse(d.gerentes));
    SYNC="Cadastro compartilhado, carregado do banco.";
    try{ localStorage.setItem(CFG_KEY,JSON.stringify(TIME)); }catch(e){}
    Object.keys(feito).forEach(k=>{ if(feito[k]) try{R[k]();}catch(e){} });
  }).catch(()=>{});
}
function entradaTime(g){ const k=Object.keys(TIME).find(x=>kk(x)===kk(g)); return k?TIME[k]:null; }
const ativo=g=>{ if(kk(g)==="INTERNA") return true; const e=entradaTime(g); return e?!!e.ativo:false; };
const timeDoGer=g=>{ const e=entradaTime(g); return e?e.time:""; };
const rotGer=g=>ativo(g)?esc(g):`${esc(g)} <span class="pill off">Desligado</span>`;

/* período global por aba (Visão Geral e Origem) */
function hojeISO(){
  const d=new Date(), y=d.getFullYear();
  if(y<ANO) return `${ANO}-01-01`;
  if(y>ANO) return `${ANO}-12-31`;
  return `${y}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
/* `auto:true` = a data final acompanha o dia de hoje. Vira false assim que o
   usuário digita uma data ou escolhe "Ano todo". Recalculado a cada render,
   então uma aba deixada aberta durante a noite se corrige sozinha. */
function novoPeriodo(){ return {ini:`${ANO}-01-01`, fim:hojeISO(), auto:true}; }
function sincHoje(p){
  if(!p||!p.auto) return false;
  const h=hojeISO();
  if(p.fim===h) return false;
  p.fim=h; return true;
}
const dentro=(t,p)=>!t.data||((!p.ini||t.data>=p.ini)&&(!p.fim||t.data<=p.fim));
function mesesDoPeriodo(p){
  const a=p.ini?+p.ini.slice(5,7)-1:0, b=p.fim?+p.fim.slice(5,7)-1:11;
  const ya=p.ini?+p.ini.slice(0,4):ANO, yb=p.fim?+p.fim.slice(0,4):ANO;
  const de=ya<ANO?0:a, ate=yb>ANO?11:b;
  return Array.from({length:12},(_,i)=>i).filter(i=>i>=de&&i<=ate);
}
/* ---------------------------------------------------------------------
   Recorte ATO (Geral x Ato pago). Fica aqui dentro de propósito: filtrar()
   é o único funil por onde passa toda venda exibida no site, então ligar o
   recorte aqui faz todas as abas, KPIs, gráficos e modais obedecerem sem
   que ninguém precise lembrar de aplicá-lo caso a caso.
   Uma venda só é "pago" se a coluna Ato disser Pago. Se a coluna sumir da
   planilha o extrator quebra alto — nunca finge que está tudo pago.
   --------------------------------------------------------------------- */
let ATO=(function(){ try{ return localStorage.getItem("plk_ato")==="pago"?"pago":"geral"; }
                     catch(e){ return "geral"; } })();
const ehPago=t=>kk(t.ato||"")==="PAGO";

const TXPEND=TX.filter(t=>!ehPago(t));

function filtrar(f,p,todos){
  f=f||{};
  return TX.filter(t=>{
    if(!todos&&ATO==="pago"&&!ehPago(t)) return false;
    if(p&&!dentro(t,p)) return false;
    if(f.mes!=null&&t.mes!==f.mes) return false;
    if(f.canal){ if(Array.isArray(f.canal)){ if(!f.canal.includes(t.canal)) return false; }
                 else if(t.canal!==f.canal) return false; }
    if(f.gerente&&t.gerente!==f.gerente) return false;
    if(f.produto){ if(Array.isArray(f.produto)){ if(!f.produto.includes(t.produto)) return false; }
                   else if(t.produto!==f.produto) return false; }
    if(f.origem&&(t.origem||"Não informada")!==f.origem) return false;
    if(f.campanha&&t.campanha!==f.campanha) return false;
    if(f.plataforma&&t.plataforma!==f.plataforma) return false;
    return true;
  });
}
/* Fração do VGV de um recorte que está com ato pago. Serve para reescalar
   número que já vem calculado da planilha e que a Base não sabe refazer —
   caso da VSO, cujo denominador considera distrato e reentrada de unidade.
   Reescalar pelo numerador mantém o denominador deles intacto; sem nada
   pendente a fração é 1 e o número volta a ser idêntico ao da planilha. */
/* Valor do m² de assinatura, recalculado no navegador a partir das vendas —
   antes vinha pronto da planilha e por isso ignorava o recorte de ato.
   Mesma regra do extrator: linhas divididas (Fifith) da mesma unidade viram
   uma venda só, com o valor somado e a metragem contada uma vez; vagas de
   garagem (peso 0) ficam de fora porque distorcem o preço por m². */
function m2Por(f,p){
  const grupos=new Map();
  filtrar(f,p).forEach(t=>{
    if(!t.metragem||!t.peso) return;
    const k=t.produto+"||"+(t.unidade||("#"+Math.random()));
    const g=grupos.get(k)||{prod:t.produto,vgv:0,m2:0};
    g.vgv+=t.valor; g.m2=Math.max(g.m2,t.metragem);
    grupos.set(k,g);
  });
  const acc={};
  grupos.forEach(g=>{ const a=acc[g.prod]||(acc[g.prod]={vgv:0,m2:0,n:0});
    a.vgv+=g.vgv; a.m2+=g.m2; a.n++; });
  const saida={};
  Object.entries(acc).forEach(([p2,a])=>{ if(a.m2>0)
    saida[p2]={valorM2:a.vgv/a.m2,metragemMedia:a.m2/a.n,vendas:a.n}; });
  const tv=Object.values(acc).reduce((s,a)=>s+a.vgv,0);
  const tm=Object.values(acc).reduce((s,a)=>s+a.m2,0);
  saida._geral={valorM2:tm?tv/tm:null,metragemMedia:null,
                vendas:Object.values(acc).reduce((s,a)=>s+a.n,0)};
  return saida;
}
function fatiaAto(f,p){
  if(ATO!=="pago") return 1;
  const tot=soma(filtrar(f,p,true));
  if(!tot) return null;
  return soma(filtrar(f,p))/tot;
}
function seletorPeriodo(id,p,aoMudar,opts){
  const el=document.getElementById(id); if(!el) return;
  const btns=(opts&&opts.presets)||[{k:"ano",r:"Ano todo"},{k:"ytd",r:"YTD"},
    {k:"mes",r:"Mês atual"},{k:"mesant",r:"Mês anterior"},{k:"tri",r:"Últimos 3 meses"}];
  el.innerHTML=`<span class="lbl">Período</span>
    <input type="date" id="${id}_i" value="${p.ini}" min="${ANO}-01-01" max="${ANO}-12-31">
    <span class="lbl">até</span>
    <input type="date" id="${id}_f" value="${p.fim}" min="${ANO}-01-01" max="${ANO}-12-31">
    ${btns.map(b=>`<button class="preset" data-k="${b.k}">${b.r}</button>`).join("")}
    ${p.auto?'<span class="lbl" style="font-size:11.5px">· termina sempre no dia de hoje</span>':""}`;
  const dois=n=>String(n).padStart(2,"0");
  const ult=m=>new Date(ANO,m+1,0).getDate();
  const aplica=()=>{ p.ini=document.getElementById(id+"_i").value||`${ANO}-01-01`;
                     p.fim=document.getElementById(id+"_f").value||hojeISO();
                     p.auto=false; aoMudar(); };
  el.querySelector("#"+id+"_i").addEventListener("change",aplica);
  el.querySelector("#"+id+"_f").addEventListener("change",aplica);
  el.querySelectorAll(".preset").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k;
    const h=hojeISO();
    if(k==="ano"){ p.ini=`${ANO}-01-01`; p.fim=`${ANO}-12-31`; p.auto=false; }
    if(k==="ytd"){ p.ini=`${ANO}-01-01`; p.fim=h; p.auto=true; }
    if(k==="tri"){ const mh=+h.slice(5,7), de=Math.max(1,mh-2);
      p.ini=`${ANO}-${dois(de)}-01`; p.fim=h; p.auto=true; }
    /* Mês fechado, do dia 1 ao último dia — não "os últimos 30 dias". Quem
       pede o mês quer comparar com a meta do mês, que é mensal fechada.
       O mês atual termina no último dia mesmo que ainda não tenha chegado:
       assim o número não muda de significado no meio do mês. */
    if(k==="mes"||k==="mesant"){
      const mh=+h.slice(5,7)-1;                       // 0..11
      const m=k==="mes"?mh:mh-1;
      if(m<0){ p.ini=`${ANO}-01-01`; p.fim=`${ANO}-01-31`; }
      else { p.ini=`${ANO}-${dois(m+1)}-01`; p.fim=`${ANO}-${dois(m+1)}-${ult(m)}`; }
      p.auto=false; }
    if(k[0]==="t"&&k.length===2){                      // t1..t4 = trimestres
      const q=+k[1], m0=(q-1)*3+1, m1=q*3;
      p.ini=`${ANO}-${dois(m0)}-01`; p.fim=`${ANO}-${dois(m1)}-${ult(m1-1)}`; p.auto=false; }
    const ci=document.getElementById(id+"_i"), cf=document.getElementById(id+"_f");
    if(ci) ci.value=p.ini; if(cf) cf.value=p.fim;      // reflete o atalho nos campos
    aoMudar();
  }));
}

/* Valor do m² de um conjunto de vendas.
   Venda dividida (Fifith = Sim) ocupa duas linhas com metade do valor cada, mas
   com a metragem cheia repetida — por isso agrupamos por unidade antes de somar.
   Vagas de garagem (peso 0) ficam de fora: preço por m² é outro universo. */
function m2DoRecorte(rows){
  const g={};
  rows.forEach(t=>{ if(!t.metragem||!t.peso) return;
    const k=t.produto+"||"+(t.unidade||Math.random());
    g[k]=g[k]||{v:0,m:0}; g[k].v+=t.valor; g[k].m=Math.max(g[k].m,t.metragem); });
  let v=0,m=0; Object.values(g).forEach(x=>{v+=x.v;m+=x.m;});
  return m?v/m:null;
}

function tabelaVendas(rows,est){
  const {ord,dir,filtros}=est;
  let dados=rows.filter(t=>{
    for(const k in filtros){ const s=filtros[k]; if(!s) continue;
      const v=t[k]==null||t[k]===""?"(vazio)":String(t[k]);
      if(!s.has(v)) return false; }
    return true;
  });
  const col=COLS.find(c=>c.k===ord)||COLS[2];
  dados.sort((a,b)=>{
    if(col.k==="produto") return ordProd(a.produto,b.produto)*dir;
    let x=a[col.k],y=b[col.k];
    if(x==null)x=col.r?-Infinity:""; if(y==null)y=col.r?-Infinity:"";
    if(typeof x==="number"&&typeof y==="number") return (x-y)*dir;
    return String(x).localeCompare(String(y),"pt")*dir;
  });
  const th=COLS.map(c=>{
    const act=filtros[c.k]?"act":"";
    const seta=c.k===ord?(dir>0?"▲":"▼"):"";
    return `<th class="${c.r?"r":""}"><span class="fh ${act}" data-k="${c.k}">
      <span>${c.t}</span><span class="car">${seta||"▾"}</span></span></th>`;
  }).join("");
  const tb=dados.map(t=>"<tr>"+COLS.map(c=>{
    const v=c.f?c.f(t[c.k]):(t[c.k]==null?"—":t[c.k]);
    const st=c.k==="desconto"&&t.desconto!=null&&t.desconto<=-.05?' style="color:var(--bad)"':"";
    return `<td class="${c.r?"r":""} ${c.nm?"nm":""}"${st}>${esc(v)}</td>`;
  }).join("")+"</tr>").join("");
  est.visiveis=dados;
  return dados.length
    ? `<div class="scroll"><table class="tb num"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`
    : `<div class="empty">Nenhuma venda com os filtros aplicados.</div>`;
}

function menuFiltro(campo,rows,est,alvo,redesenhar){
  const col=COLS.find(c=>c.k===campo);
  const vals=Array.from(new Set(rows.map(t=>t[campo]==null||t[campo]===""?"(vazio)":String(t[campo]))));
  vals.sort((a,b)=>campo==="produto"?ordProd(a,b):a.localeCompare(b,"pt",{numeric:true}));
  const sel=est.filtros[campo]?new Set(est.filtros[campo]):new Set(vals);
  const linhas=v=>vals.filter(x=>!v||x.toLowerCase().includes(v.toLowerCase()))
    .map(x=>`<label><input type="checkbox" value="${esc(x)}" ${sel.has(x)?"checked":""}>
      <span>${esc(col.f&&campo!=="produto"?col.f(x):x)}</span></label>`).join("");
  FM.innerHTML=`
    <button class="op" data-s="az">↑&nbsp; Classificar A → Z</button>
    <button class="op" data-s="za">↓&nbsp; Classificar Z → A</button><hr>
    <input class="srch" placeholder="Buscar valor…">
    <div class="fvals"><label style="font-weight:650"><input type="checkbox" id="fAll"
      ${sel.size===vals.length?"checked":""}><span>(Selecionar tudo)</span></label>${linhas("")}</div>
    <div class="fbtns"><button class="ok">OK</button><button class="lim">Limpar</button></div>`;
  const r=alvo.getBoundingClientRect();
  FM.style.left=Math.max(8,Math.min(r.left,innerWidth-278))+"px";
  FM.style.top=Math.min(r.bottom+6,innerHeight-320)+"px";
  FM.classList.add("on"); fmAberto=campo;

  const box=FM.querySelector(".fvals");
  FM.querySelector(".srch").addEventListener("input",e=>{
    const t=e.target.value;
    box.innerHTML=`<label style="font-weight:650"><input type="checkbox" id="fAll"
      ${sel.size===vals.length?"checked":""}><span>(Selecionar tudo)</span></label>`+linhas(t);
    liga();
  });
  function liga(){
    box.querySelector("#fAll").addEventListener("change",e=>{
      box.querySelectorAll('input[type=checkbox]:not(#fAll)').forEach(c=>c.checked=e.target.checked);
    });
  }
  liga();
  FM.querySelectorAll(".op").forEach(b=>b.addEventListener("click",()=>{
    est.ord=campo; est.dir=b.dataset.s==="az"?1:-1; fecharFiltro(); redesenhar();
  }));
  FM.querySelector(".lim").addEventListener("click",()=>{
    delete est.filtros[campo]; fecharFiltro(); redesenhar();
  });
  FM.querySelector(".ok").addEventListener("click",()=>{
    const marcados=Array.from(box.querySelectorAll('input[type=checkbox]:not(#fAll)'))
      .filter(c=>c.checked).map(c=>c.value);
    // mantém escolhas de valores que estavam fora do texto buscado
    const visiveis=new Set(Array.from(box.querySelectorAll('input[type=checkbox]:not(#fAll)')).map(c=>c.value));
    const finais=new Set(marcados);
    if(est.filtros[campo]) est.filtros[campo].forEach(v=>{ if(!visiveis.has(v)) finais.add(v); });
    if(finais.size===vals.length||finais.size===0) delete est.filtros[campo];
    else est.filtros[campo]=finais;
    fecharFiltro(); redesenhar();
  });
}

/* =====================================================================
   GRÁFICOS
   ===================================================================== */
function eixoY(g,pad,W,ih,max,fmtv){
  for(let t=0;t<=4;t++){ const v=max/4*t, y=pad.t+ih-(v/max)*ih;
    g.push(`<line class="gridline" x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}"/>`);
    g.push(`<text class="axislab" x="${pad.l-7}" y="${y+3.5}" text-anchor="end">${fmtv(v)}</text>`); }
  return g;
}
function barrasMes(el,series,o){
  o=o||{}; const meses=o.meses||Array.from({length:12},(_,i)=>i);
  const foco=o.foco?new Set(o.foco):null;   // meses dentro do período selecionado
  const dentroF=mi=>!foco||foco.has(mi);
  const W=780,H=o.altura||280,pad={t:o.ating?28:18,r:12,b:28,l:o.padL||86};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, n=meses.length;
  /* O piso do eixo era 1. Em gráfico de reais isso é inofensivo — um real não
     muda escala nenhuma quando o eixo vai a milhões. Em gráfico de FRAÇÃO é
     desastre: o VSO, que vai a 0,071, era desenhado num eixo que ia até 1,14,
     ou seja 114%, e as barras viravam tracinhos no chão. O piso agora é
     praticamente zero: serve só para não dividir por zero numa série vazia,
     e deixa a escala seguir o dado em qualquer unidade. */
  const max=Math.max(o.minimo!=null?o.minimo:1e-9,
    ...series.flatMap(s=>meses.map(i=>s.valores[i]||0)))*1.14;
  const fmtv=o.fmtv||(v=>nf(v,0)), fmtt=o.fmtt||moeda;
  const band=iw/n, x=k=>pad.l+band*k, y=v=>pad.t+ih-(v/max)*ih;
  let g=eixoY([],pad,W,ih,max,fmtv);
  g.push(`<line class="axis" x1="${pad.l}" y1="${y(0)}" x2="${W-pad.r}" y2="${y(0)}"/>`);
  const k=series.length, bw=Math.min(17,(band-8)/k);
  meses.forEach((mi,idx)=>{
    const x0=x(idx)+(band-bw*k-2*(k-1))/2;
    series.forEach((s,j)=>{
      const v=s.valores[mi]||0, yy=y(v), h=Math.max(y(0)-yy,0), bx=x0+j*(bw+2);
      if(h<=0) return;
      const op=dentroF(mi)?"":' opacity=".26"';
      g.push(s.tipo==="ref"
        ? `<rect x="${bx}" y="${yy}" width="${bw}" height="${h}" rx="4" fill="none" stroke="${s.cor}" stroke-width="1.5"${op}/>`
        : `<rect x="${bx}" y="${yy}" width="${bw}" height="${h}" rx="4" fill="${s.cor}"${op}/>`);
      if(o.rot&&s.tipo!=="ref"&&v>0&&dentroF(mi))
        g.push(`<text class="dlab" x="${bx+bw/2}" y="${yy-6}" text-anchor="middle">${o.rot(v)}</text>`);
    });
    if(o.ating&&o.ating[mi]!=null&&(series[0].valores[mi]||0)>0&&dentroF(mi))
      g.push(`<text class="dlab" x="${x(idx)+band/2}" y="${pad.t-9}" text-anchor="middle"
        style="fill:${stCol(o.ating[mi])}">${pct(o.ating[mi])}</text>`);
    g.push(`<text class="axislab" x="${x(idx)+band/2}" y="${H-8}" text-anchor="middle"
      ${mi===MESREF-1?'style="fill:var(--ink);font-weight:700"':(dentroF(mi)?"":'opacity=".45"')}>${MES[mi]}</text>`);
    const tt=series.map(s=>`${s.nome}: <b>${s.valores[mi]==null?"—":fmtt(s.valores[mi])}</b>`).join("<br>")
      +(dentroF(mi)?"":"<br><span style='color:var(--muted)'>fora do período selecionado</span>");
    g.push(`<rect class="hit" x="${x(idx)}" y="${pad.t}" width="${band}" height="${ih}" fill="transparent"
      data-tip="<b>${MESL[mi]}</b><br>${tt}${o.aoClicar?"<br><span style='color:var(--muted)'>clique para ver as vendas</span>":""}"
      ${o.aoClicar?`data-mes="${mi}"`:""}/>`);
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria||"Gráfico mensal"}">${g.join("")}</svg>`;
  bindTips(el);
  if(o.aoClicar) el.querySelectorAll("[data-mes]").forEach(r=>{
    r.style.cursor="pointer"; r.addEventListener("click",()=>o.aoClicar(+r.dataset.mes)); });
}
function linhas(el,series,o){
  o=o||{}; const meses=o.meses||Array.from({length:12},(_,i)=>i);
  const foco=o.foco?new Set(o.foco):null;
  const dentroF=mi=>!foco||foco.has(mi);
  /* Com rótulos ligados o gráfico precisa de mais largura por mês, senão dois
     valores vizinhos disputam o mesmo espaço. Largura é do viewBox: aumentar
     aqui não estica nada na tela, só dá mais folga relativa ao texto. */
  const W=o.largura||(o.rotulos?1060:780);
  const H=o.altura||280, pad={t:o.rotulos?32:20,r:o.rotulos?34:20,b:28,l:o.padL||86};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, n=meses.length;
  const max=Math.max(o.minimo!=null?o.minimo:1e-9,   /* mesmo motivo do barrasMes */
    ...series.flatMap(s=>meses.map(i=>s.valores[i]||0)))*1.14;
  const fmtv=o.fmtv||(v=>nf(v,0)), fmtt=o.fmtt||moeda;
  const band=iw/n, x=k=>pad.l+band*k+band/2, y=v=>pad.t+ih-(v/max)*ih;
  let g=eixoY([],pad,W,ih,max,fmtv);
  const obst=[];   /* pontos já desenhados: rótulo nenhum pode cobri-los */
  series.forEach(s=>{
    const pts=meses.map((mi,k)=>s.valores[mi]==null?null:`${x(k)},${y(s.valores[mi])}`).filter(Boolean).join(" ");
    g.push(`<polyline points="${pts}" fill="none" stroke="${s.cor}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" ${s.ref?'opacity=".6"':""}/>`);
    meses.forEach((mi,k)=>{ if(s.valores[mi]==null) return;
      const cy=y(s.valores[mi]);
      g.push(`<circle cx="${x(k)}" cy="${cy}" r="4" fill="${s.cor}" stroke="var(--card)"
        stroke-width="2"${dentroF(mi)?"":' opacity=".3"'}/>`);
      obst.push({x0:x(k)-6,x1:x(k)+6,y0:cy-6,y1:cy+6}); });
  });
  /* ---------------------------------------------------------------------
     Rótulos com desvio de colisão. Cada valor tenta uma sequência de poses
     (acima, abaixo, mais acima, deslocado p/ o lado) e fica na primeira que
     não encosta em nada já colocado nem sai da moldura. O que não couber em
     pose nenhuma fica sem rótulo — e só nesse caso o hover é necessário.
     Sem isso dois meses seguidos com valor parecido escrevem um por cima
     do outro, que foi exatamente o que apareceu no Nov/Dez do Linn.
     --------------------------------------------------------------------- */
  if(o.rotulos){
    const CW=5.75, caixas=obst.slice(), cands=[];
    const livre=b=>b.x0>=3&&b.x1<=W-3&&b.y0>=3&&b.y1<=pad.t+ih+6
      &&!caixas.some(c=>b.x0<c.x1-0.5&&b.x1>c.x0+0.5&&b.y0<c.y1-0.5&&b.y1>c.y0+0.5);
    series.forEach(s=>meses.forEach((mi,k)=>{
      const v=s.valores[mi];
      if(v==null||!(v>0)||!dentroF(mi)) return;
      cands.push({cor:s.cor,px:x(k),py:y(v),
        txt:o.rotulo?o.rotulo(v):nf(v,0)});
    }));
    cands.sort((a,b)=>a.py-b.py);          /* picos escolhem primeiro */
    const POSES=[[0,-12,"middle"],[0,16,"middle"],[0,-25,"middle"],[0,29,"middle"],
                 [-10,-12,"end"],[10,-12,"start"],[-10,16,"end"],[10,16,"start"],
                 [0,-38,"middle"],[0,42,"middle"]];
    cands.forEach(c=>{
      const w=c.txt.length*CW;
      for(const [dx,dy,anc] of POSES){
        const cx=c.px+dx, yb=c.py+dy;
        const x0=anc==="middle"?cx-w/2:anc==="start"?cx:cx-w;
        const b={x0,x1:x0+w,y0:yb-9,y1:yb+3};
        if(livre(b)){
          caixas.push(b);
          g.push(`<text class="dlab halo" x="${cx}" y="${yb}" text-anchor="${anc}"
            style="fill:${c.cor}">${c.txt}</text>`);
          return;
        }
      }
    });
  }
  meses.forEach((mi,k)=>{
    g.push(`<text class="axislab" x="${x(k)}" y="${H-8}" text-anchor="middle"
      ${mi===MESREF-1?'style="fill:var(--ink);font-weight:700"':(dentroF(mi)?"":'opacity=".45"')}>${MES[mi]}</text>`);
    const tt=series.map(s=>`${s.nome}: <b>${s.valores[mi]==null?"—":fmtt(s.valores[mi])}</b>`).join("<br>")
      +(dentroF(mi)?"":"<br><span style='color:var(--muted)'>fora do período selecionado</span>");
    g.push(`<rect class="hit" x="${pad.l+band*k}" y="${pad.t}" width="${band}" height="${ih}" fill="transparent"
      data-tip="<b>${MESL[mi]}</b><br>${tt}${o.aoClicar?"<br><span style='color:var(--muted)'>clique para ver as vendas</span>":""}"
      ${o.aoClicar?`data-mes="${mi}"`:""}/>`);
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria||"Evolução mensal"}">${g.join("")}</svg>`;
  bindTips(el);
  if(o.aoClicar) el.querySelectorAll("[data-mes]").forEach(r=>{
    r.style.cursor="pointer"; r.addEventListener("click",()=>o.aoClicar(+r.dataset.mes)); });
}
/* =====================================================================
   FORMA DO GRÁFICO — barra ou linha, escolha de quem lê

   A mesma série mensal responde a perguntas diferentes conforme o desenho:
   barra é boa para comparar meses entre si, linha é boa para ver a trajetória.
   Em vez de decidir por todo mundo, cada gráfico ganha um botão, e a escolha
   fica guardada por gráfico no próprio navegador — quem gosta de linha na
   Visão Geral não precisa reescolher toda vez que entra.

   Só vale para série mensal. O ranking de canais é barra horizontal (não tem
   eixo de tempo para virar linha) e o gráfico de desconto já é misto, com
   linha e barra ao mesmo tempo; nesses dois o botão não aparece.
   ===================================================================== */
const FORMA=(function(){ try{ return JSON.parse(localStorage.getItem("plk_forma")||"{}"); }
                         catch(e){ return {}; } })();
const FORMA_CFG={};
const formaDe=id=>FORMA[id]==="linha"?"linha":"barra";
function btnForma(id){
  const f=formaDe(id);
  return `<div class="tgl forma" data-forma-de="${id}" role="group" aria-label="Formato do gráfico">
    <button data-f="barra" class="${f==="barra"?"on":""}" title="Ver em barras">Barra</button>
    <button data-f="linha" class="${f==="linha"?"on":""}" title="Ver em linha">Linha</button></div>`;
}
/* Desenha no formato escolhido e guarda a configuração, para o botão
   conseguir redesenhar sem que a aba inteira precise ser repintada. */
function desenhaForma(id,cfg){
  const el=document.getElementById(id); if(!el) return;
  FORMA_CFG[id]=cfg;
  const series=cfg.series||[{nome:cfg.nome||"Valor",valores:cfg.valores,cor:cfg.cor||"var(--s2)"}];
  const meses=Array.isArray(cfg.meses)?cfg.meses:Array.from({length:cfg.meses||12},(_,i)=>i);
  const o={meses,foco:cfg.foco,ating:cfg.ating,aria:cfg.aria,aoClicar:cfg.aoClicar,
    altura:cfg.altura,padL:cfg.padL,minimo:cfg.minimo,largura:cfg.largura,
    fmtv:cfg.fmt,fmtt:cfg.fmt,rot:cfg.rot,rotulo:cfg.rot,
    rotulos:cfg.rot?true:!!cfg.rotulos};
  (formaDe(id)==="linha"?linhas:barrasMes)(el,series,o);
}
/* Um ouvinte só, no documento: os botões nascem e morrem junto com as abas,
   e religar listener a cada repintura é como se perde evento pelo caminho. */
document.addEventListener("click",function(e){
  const b=e.target&&e.target.closest?e.target.closest("[data-forma-de] button[data-f]"):null;
  if(!b) return;
  const box=b.closest("[data-forma-de]"), id=box.dataset.formaDe;
  if(formaDe(id)===b.dataset.f) return;
  FORMA[id]=b.dataset.f;
  try{ localStorage.setItem("plk_forma",JSON.stringify(FORMA)); }catch(err){}
  box.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.f===FORMA[id]));
  if(FORMA_CFG[id]) desenhaForma(id,FORMA_CFG[id]);
});

function donut(el,fatias,centro,aoClicar){
  const R=94,r=58,cx=110,cy=110, tot=fatias.reduce((s,f)=>s+f.valor,0)||1;
  let a=-Math.PI/2, g="";
  fatias.forEach(f=>{
    const ang=(f.valor/tot)*Math.PI*2, G=0.016, a0=a+G/2, a1=a+ang-G/2;
    if(a1>a0){ const big=(a1-a0)>Math.PI?1:0;
      g+=`<path d="M ${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A ${R} ${R} 0 ${big} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}
        L ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} A ${r} ${r} 0 ${big} 0 ${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} Z"
        fill="${f.cor}" class="hit" data-nome="${esc(f.nome)}"
        data-tip="<b>${esc(f.nome)}</b><br>${moeda(f.valor)} · ${pct(f.valor/tot)}<br><span style='color:var(--muted)'>clique para abrir</span>"/>`; }
    a+=ang;
  });
  g+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" class="axislab"
    style="font-size:10px;letter-spacing:.09em;font-weight:700">REALIZADO</text>`;
  g+=`<text x="${cx}" y="${cy+15}" text-anchor="middle"
    style="fill:var(--ink);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums">${centro}</text>`;
  el.innerHTML=`<svg viewBox="0 0 220 220" style="max-width:236px;margin:0 auto" role="img"
    aria-label="Participação por canal">${g}</svg>`;
  bindTips(el);
  if(aoClicar) el.querySelectorAll("[data-nome]").forEach(p=>{
    p.style.cursor="pointer"; p.addEventListener("click",()=>aoClicar(p.dataset.nome)); });
}
function spark(vals,cor){
  const W=110,H=26,m=Math.max(1,...vals.map(v=>v||0));
  const x=i=>i*(W/Math.max(1,vals.length-1)), y=v=>H-2-((v||0)/m)*(H-6);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:110px;height:26px"><polyline
    points="${vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="${cor||"var(--s1)"}"
    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function barrasH(el,itens,o){
  o=o||{};
  const max=Math.max(1,...itens.map(i=>Math.max(i.valor||0,o.comMeta?(i.meta||0):0)));
  el.innerHTML=itens.map(i=>`
    <div style="margin-bottom:13px" class="hit" ${o.aoClicar?`data-nome="${esc(i.nome)}"`:""}
      data-tip="<b>${esc(i.nome)}</b><br>Realizado: <b>${moeda(i.valor)}</b>${o.comMeta?`<br>Meta: <b>${moeda(i.meta)}</b>`:""}${i.ating!=null?`<br>Atingimento: <b>${pct1(i.ating)}</b>`:""}${o.aoClicar?"<br><span style='color:var(--muted)'>clique para ver as vendas</span>":""}">
      <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:5px;flex-wrap:wrap">
        <span style="font-weight:600;font-size:13px">${esc(i.nome)}</span>
        <span class="num" style="margin-left:auto;font-size:12.5px;color:var(--ink-2)">${moeda(i.valor)}</span></div>
      <div class="track">${o.comMeta&&i.meta>0?`<div class="metamark" style="left:${Math.min((i.meta/max)*100,100)}%"></div>`:""}
        <div class="barfill" style="width:${Math.min((i.valor/max)*100,100)}%;background:${i.cor||o.cor||"var(--s1)"}"></div></div>
    </div>`).join("");
  bindTips(el);
  if(o.aoClicar) el.querySelectorAll("[data-nome]").forEach(d=>{

/* Dois painéis empilhados dividindo o eixo de meses. Duas medidas de escalas
   diferentes NUNCA vão no mesmo eixo — viram dois gráficos, um sobre o outro. */
function duploPainel(el,cfg,o){
  o=o||{};
  const W=780,H=352,pad={l:o.padL||74,r:18};
  const topo={t:34,h:132}, base={t:224,h:74};
  const iw=W-pad.l-pad.r, band=iw/12;
  // a escala do desconto inclui o teto, senão a linha do teto sai do quadro
  const mx1=Math.max(...cfg.linha.valores.filter(v=>v!=null).map(Math.abs),
                     Math.abs(o.limite||0),0.01)*1.18;
  const mx2=Math.max(...cfg.barras.valores.map(v=>v||0),1)*1.3;
  const X=i=>pad.l+band*i+band/2;
  const Y1=v=>topo.t+(Math.abs(v)/mx1)*topo.h;      // 0 no topo, desconto desce
  const Y2=v=>base.t+base.h-((v||0)/mx2)*base.h;
  let g=[];
  // faixa vermelha suave abaixo do teto = zona fora da política
  if(o.limite!=null){
    const yt=Y1(o.limite);
    g.push(`<rect x="${pad.l}" y="${yt}" width="${iw}" height="${Math.max(topo.t+topo.h-yt,0)}"
      fill="var(--bad)" opacity=".07"/>`);
  }
  for(let t=0;t<=4;t++){ const v=mx1/4*t, y=Y1(v);
    g.push(`<line class="gridline" x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}"/>`);
    g.push(`<text class="axislab" x="${pad.l-7}" y="${y+3.5}" text-anchor="end">${cfg.linha.fmt(-v)}</text>`); }
  g.push(`<text class="axislab" x="${pad.l}" y="${topo.t-14}" style="font-weight:700">${cfg.linha.nome}</text>`);
  if(o.limite!=null){
    const yt=Y1(o.limite);
    g.push(`<line x1="${pad.l}" y1="${yt}" x2="${W-pad.r}" y2="${yt}" stroke="var(--bad)"
      stroke-width="1.5" opacity=".8"/>`);
    g.push(`<text class="dlab" x="${W-pad.r}" y="${yt-6}" text-anchor="end"
      style="fill:var(--bad)">teto ${cfg.linha.fmt(o.limite)}</text>`);
  }
  const pts=cfg.linha.valores.map((v,i)=>v==null?null:`${X(i)},${Y1(v)}`).filter(Boolean).join(" ");
  g.push(`<polyline points="${pts}" fill="none" stroke="${cfg.linha.cor}" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>`);
  cfg.linha.valores.forEach((v,i)=>{ if(v==null) return;
    const fora=(o.limite!=null&&v<o.limite);
    g.push(`<circle cx="${X(i)}" cy="${Y1(v)}" r="4.5" fill="${fora?"var(--bad)":cfg.linha.cor}"
      stroke="var(--card)" stroke-width="2"/>`);
    g.push(`<text class="dlab" x="${X(i)}" y="${Math.min(Y1(v)+16,topo.t+topo.h+13)}" text-anchor="middle"
      style="fill:${fora?"var(--bad)":"var(--ink-2)"}">${cfg.linha.fmt(v)}</text>`); });
  g.push(`<text class="axislab" x="${pad.l}" y="${base.t-10}" style="font-weight:700">${cfg.barras.nome}</text>`);
  g.push(`<line class="axis" x1="${pad.l}" y1="${Y2(0)}" x2="${W-pad.r}" y2="${Y2(0)}"/>`);
  const bw=Math.min(26,band*.52);
  cfg.barras.valores.forEach((v,i)=>{ if(!v) return;
    g.push(`<rect x="${X(i)-bw/2}" y="${Y2(v)}" width="${bw}" height="${Math.max(Y2(0)-Y2(v),0)}" rx="4"
      fill="${cfg.barras.cor}"/>`);
    g.push(`<text class="dlab" x="${X(i)}" y="${Math.max(Y2(v)-6,base.t-1)}" text-anchor="middle">${nf(v)}</text>`); });
  for(let i=0;i<12;i++){
    g.push(`<text class="axislab" x="${X(i)}" y="${H-7}" text-anchor="middle"
      ${i===MESREF-1?'style="fill:var(--ink);font-weight:700"':""}>${MES[i]}</text>`);
    g.push(`<rect class="hit" x="${pad.l+band*i}" y="${topo.t}" width="${band}" height="${H-topo.t-20}"
      fill="transparent" data-mes="${i}"
      data-tip="<b>${MESL[i]}</b><br>${cfg.linha.nome}: <b>${cfg.linha.valores[i]==null?"—":cfg.linha.fmt(cfg.linha.valores[i])}</b><br>${cfg.barras.nome}: <b>${nf(cfg.barras.valores[i]||0)}</b>${o.aoClicar?"<br><span style='color:var(--muted)'>clique para ver as vendas</span>":""}"/>`);
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria||""}">${g.join("")}</svg>`;
  bindTips(el);
  if(o.aoClicar) el.querySelectorAll("[data-mes]").forEach(r=>{ r.style.cursor="pointer";
    r.addEventListener("click",()=>o.aoClicar(+r.dataset.mes)); });
}

/* =====================================================================
   MODAL DO CADASTRO (engrenagem)
   ===================================================================== */
let cfgEdicao=false;
function ehAdmin(){ return window.currentUser && window.currentUser.role==="admin"; }
/* Engrenagem: "edita" mexe no cadastro, "le" só olha, sem cfg não vê o botão.
   Isto é organização de interface, não segurança: quem entra no site recebe o
   payload inteiro de qualquer jeito. O que de fato protege a escrita são as
   regras do Firestore. */
function cfgNivel(){ const u=window.currentUser; return (u&&u.cfg)||""; }
function podeVerCfg(){ return cfgNivel()==="edita"||cfgNivel()==="le"; }
function podeEditarCfg(){ return cfgNivel()==="edita"; }
function podeUsarChat(){ const u=window.currentUser; return !!(u&&(u.chat||u.user==="admin")); }

/* =====================================================================
   VISÃO RESTRITA — Diretor de Parcerias

   Ele acompanha o resultado inteiro da empresa, mas não pode ver por quanto
   nem com que desconto uma unidade foi vendida por outro canal.

   O que protege isso NÃO é este arquivo: é o servidor. Quem tem visão
   "parcerias" recebe do Firestore um documento diferente, em que as vendas
   dos outros canais já vêm somadas por mês, sem unidade, sem desconto e sem
   gerente. O dado proibido não chega no computador dele — nem pelo F12.

   O que este trecho faz é o acabamento: esconde as abas que perderam a
   matéria-prima e avisa, onde falta detalhe, que falta por causa do acesso.
   Se alguém marcasse a visão restrita aqui e esquecesse a regra do
   Firestore, a tela ficaria certa e o dado continuaria exposto — por isso a
   engrenagem avisa em vermelho quando isso acontece.
   ===================================================================== */
const ABAS_FORA_PARCERIAS=["desconto","origem","vso"];
function visaoDe(){ const u=window.currentUser; return (u&&u.visao)||""; }
function visaoRestrita(){ return visaoDe()==="parcerias"; }
const CANAL_VISIVEL="Parcerias";
/* a linha veio somada do servidor: existe para o total fechar, não para ser
   aberta. Vale tanto para o extrato quanto para qualquer contagem de linha. */
function pintaAcessos(){
  const b=$("#cfgBtn"); if(b) b.style.display=podeVerCfg()?"":"none";
  const c=$("#chatBtn"); if(c) c.style.display=podeUsarChat()?"":"none";
  const r=visaoRestrita();
  ABAS_FORA_PARCERIAS.forEach(p=>{
    const t=document.querySelector(`.tab[data-p="${p}"]`);
    if(t) t.style.display=r?"none":"";
  });
  /* se a aba escondida era a que estava aberta, volta para a Síntese */
  const ab=document.querySelector(".tab.on");
  if(r&&ab&&ABAS_FORA_PARCERIAS.indexOf(ab.dataset.p)>=0&&typeof mostrar==="function")
    mostrar("sintese");
}

/* =====================================================================
   ACESSOS — quem entra e o que vê da engrenagem

   Os três acessos originais moram no HTML. Os que você criar depois ficam
   no Firestore (config/acessos), para não precisar reeditar e republicar o
   site toda vez que entrar alguém no time.

   "admin" é fixo em edita e não pode ser removido daqui. É a trava contra o
   acidente óbvio: rebaixar a si mesmo e não sobrar ninguém capaz de devolver
   o acesso a ninguém sem mexer no arquivo.

   Continua valendo o mesmo aviso: isto organiza a interface, não protege
   dado. Quem faz login recebe o payload inteiro. A trava de verdade contra
   escrita indevida são as regras do Firestore.
   ===================================================================== */
const NIVEIS=[{v:"edita",r:"Edita o cadastro"},{v:"le",r:"Vê a engrenagem"},{v:"",r:"Só o relatório"}];
/* Quanto do DADO a pessoa recebe — não é o mesmo que o nível da engrenagem.
   A visão decide qual documento o navegador dela pede ao Firestore. */
const VISOES=[{v:"",r:"Vê tudo"},{v:"parcerias",r:"Diretor Parcerias"}];
const ACESSO_BASE=JSON.parse(JSON.stringify(window.PLK_ROLES||{}));
let ACESSOS={}, SYNCAC="Somente os acessos originais do arquivo.";
const loginOk=s=>/^[a-z0-9._-]{2,40}$/.test(String(s||"").trim().toLowerCase());

function aplicarAcessos(){
  /* base do arquivo + o que veio do banco; "admin" volta a edita sempre */
  const m=Object.assign({},ACESSO_BASE);
  Object.entries(ACESSOS).forEach(([u,c])=>{
    m[u]=Object.assign({},m[u]||{role:"leitor"},
      {nome:c.nome||(m[u]||{}).nome||u,cfg:c.cfg||"",chat:!!c.chat,visao:c.visao||""});
    if(c.visao==="parcerias") m[u].role="diretor_parcerias";
  });
  if(m.admin){ m.admin.cfg="edita"; m.admin.chat=true; m.admin.visao=""; }
  window.PLK_ROLES=m;
  /* quem já está logado sente a mudança na hora, sem novo login */
  const u=window.currentUser;
  if(u&&m[u.user]) window.currentUser=Object.assign({},u,m[u.user],{user:u.user});
  else if(u&&!m[u.user]) window.currentUser=Object.assign({},u,{cfg:""});
  pintaAcessos();
}
function carregarAcessosDoBanco(){
  if(!window.PLK_DB) return;
  window.PLK_DB.collection("config").doc("acessos").get().then(sn=>{
    if(!sn.exists) return;
    const d=sn.data()||{}; if(!d.lista) return;
    ACESSOS=JSON.parse(d.lista);
    SYNCAC="Lista de acessos carregada do banco.";
    aplicarAcessos();
    if(pilha.length&&document.getElementById("cfgBody")) pintaCfg();
  }).catch(()=>{});
}
function salvarAcessos(){
  aplicarAcessos();
  if(!window.PLK_DB){ SYNCAC="Sem banco: a mudança vale só nesta sessão."; pintaCfg(); return; }
  window.PLK_DB.collection("config").doc("acessos")
    .set({lista:JSON.stringify(ACESSOS),por:(window.currentUser||{}).user||"",ts:Date.now()})

}
